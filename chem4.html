function shuf(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t}return b}

function nm(e){return cap(e[2])+" ("+e[1]+")"}
const MAIN=E.filter(e=>[1,2,13,14,15,16,17,18].indexOf(e[3])>=0&&e[0]!==1);
function valence(e){if(e[0]===2)return 2;return e[3]<=2?e[3]:e[3]-10}
function shells(Z){const c=[2,8,8,2],out=[];let r=Z;for(let i=0;i<c.length&&r>0;i++){const k=Math.min(c[i],r);out.push(k);r-=k}return out}

/* ---------- drawings ---------- */
function bohrSVG(sh,o){o=o||{};const sz=o.size||150,c=80,R=[30,44,58,72];
  let s='<svg class="bohr" viewBox="0 0 160 160" width="'+sz+'" height="'+sz+'" role="img" aria-label="Bohr model">';
  for(let i=0;i<sh.length;i++)s+='<circle class="ring" cx="'+c+'" cy="'+c+'" r="'+R[i]+'"/>';
  s+='<circle class="nuc" cx="'+c+'" cy="'+c+'" r="'+(o.p!=null?21:13)+'"/>';
  if(o.p!=null)s+='<text x="'+c+'" y="'+(c-2)+'">'+o.p+' p\u207a</text><text x="'+c+'" y="'+(c+10)+'">'+o.n+' n\u2070</text>';
  sh.forEach(function(k,i){const r=R[i];
    for(let j=0;j<k;j++){const a=(-90+360*j/k)*Math.PI/180;
      s+='<circle class="e" cx="'+(c+r*Math.cos(a)).toFixed(1)+'" cy="'+(c+r*Math.sin(a)).toFixed(1)+'" r="3.6"/>'}});
  return s+'</svg>';
}
/* sides: top, right, bottom, left. rule from class handout: one per side first, then pair up */
function lewisSVG(sym,n,pairFirst){
  const per=[0,0,0,0];
  if(pairFirst){let r=n;for(let i=0;i<4&&r>0;i++){const k=Math.min(2,r);per[i]=k;r-=k}}
  else{for(let i=0;i<n;i++)per[i%4]++}
  const w=74,c=37,d=19,g=5.5;let s='<svg class="lew" viewBox="0 0 74 74" width="66" height="66" role="img" aria-label="Lewis dot structure">';
  s+='<text x="'+c+'" y="'+(c+1)+'">'+sym+'</text>';
  const pos=[[0,-1],[1,0],[0,1],[-1,0]];
  per.forEach(function(k,i){const p=pos[i],cx=c+p[0]*d,cy=c+p[1]*d;
    if(k===1)s+='<circle cx="'+cx+'" cy="'+cy+'" r="3"/>';
    if(k===2){if(p[0]===0)s+='<circle cx="'+(cx-g)+'" cy="'+cy+'" r="3"/><circle cx="'+(cx+g)+'" cy="'+cy+'" r="3"/>';
      else s+='<circle cx="'+cx+'" cy="'+(cy-g)+'" r="3"/><circle cx="'+cx+'" cy="'+(cy+g)+'" r="3"/>'}});
  return s+'</svg>';
}
function lewisOf(e){return e[0]===2?lewisSVG("He",2,true):lewisSVG(e[1],valence(e),false)}
/* line positions read off the BAT sheet's spectra chart (nm) */
const SPEC={Hg:[405,408,436,546,577,579],Ne:[540,585,614,640,651,660,693],He:[447,471,492,502,588,668],Ar:[416,420,426,451,675,687,696],Na:[569,589,616]};
const SPECN={Hg:"mercury",Ne:"neon",He:"helium",Ar:"argon",Na:"sodium"};
function specSVG(rows){const L=78,W=330,rh=26,H=rows.length*rh+30;
  const x=nm=>L+(nm-400)/300*W;
  let s='<svg class="spec" viewBox="0 0 '+(L+W+12)+' '+H+'" width="100%" style="max-width:440px" role="img" aria-label="bright-line spectra">';
  rows.forEach(function(r,i){const y=i*rh+4;
    s+='<text x="'+(L-6)+'" y="'+(y+15)+'" text-anchor="end">'+r[0]+'</text><rect x="'+L+'" y="'+y+'" width="'+W+'" height="20"/>';
    r[1].forEach(function(nm){s+='<line class="l" x1="'+x(nm).toFixed(1)+'" x2="'+x(nm).toFixed(1)+'" y1="'+y+'" y2="'+(y+20)+'"/>'})});
  const yb=rows.length*rh+4;
  [400,450,500,550,600,650,700].forEach(function(t){s+='<line class="t" x1="'+x(t)+'" x2="'+x(t)+'" y1="'+(yb-2)+'" y2="'+(yb+3)+'"/><text x="'+x(t)+'" y="'+(yb+15)+'" text-anchor="middle" style="font-weight:400;font-size:10px">'+t+'</text>'});
  return s+'</svg>';
}
function emitSVG(){
  const pan=function(ox,title,ePos,extra){let s='<g transform="translate('+ox+',0)"><text x="70" y="14" text-anchor="middle" style="font:600 11px -apple-system,sans-serif;fill:currentColor">'+title+'</text>';
    s+='<circle cx="70" cy="90" r="9" fill="#3f8c99"/>';[28,46,64].forEach(function(r){s+='<circle cx="70" cy="90" r="'+r+'" fill="none" stroke="#8a93a3" stroke-width="1.4"/>'});
    s+='<circle cx="'+ePos[0]+'" cy="'+ePos[1]+'" r="4.5" fill="#ffd166"/>'+extra+'</g>';return s};
  let s='<svg viewBox="0 0 450 170" width="100%" style="max-width:520px;color:inherit" role="img" aria-label="absorb and emit diagram">';
  s+=pan(0,"1. Ground state",[70,62],'<text x="70" y="166" text-anchor="middle" style="font:11px sans-serif;fill:currentColor">electron in lowest shell</text>');
  s+=pan(150,"2. Absorbs energy",[70,26],'<path d="M10 40 L44 70" stroke="#ff8a8a" stroke-width="2.5" marker-end="url(#ah)"/><path d="M70 60 L70 32" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#ah2)"/><text x="70" y="166" text-anchor="middle" style="font:11px sans-serif;fill:currentColor">jumps UP to excited state</text>');
  s+=pan(300,"3. Drops, emits photon",[70,62],'<path d="M70 30 L70 56" stroke="#ffd166" stroke-width="2" marker-end="url(#ah2)"/><path d="M84 40 q6 -8 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#4dd0e1" stroke-width="2.4" marker-end="url(#ah3)"/><text x="70" y="166" text-anchor="middle" style="font:11px sans-serif;fill:currentColor">falls DOWN, light leaves</text>');
  s+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#ff8a8a"/></marker><marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#ffd166"/></marker><marker id="ah3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8z" fill="#4dd0e1"/></marker></defs>';
  return s+'</svg>';
}
function ion(sym,ch){return '<span class="ion">'+sym+'<sup>'+ch+'</sup></span>'}
function ionOf(e){const g=e[3];
  if(g===1)return ion(e[1],"+");if(g===2)return ion(e[1],"2+");if(g===13)return ion(e[1],"3+");
  if(g===15)return ion(e[1],"3\u2212");if(g===16)return ion(e[1],"2\u2212");if(g===17)return ion(e[1],"\u2212");return "No ion (N/A)"}

function mcq(topic,q,ans,wrong,why,fig){const seen={};seen[String(ans)]=1;const w=[];wrong.forEach(x=>{x=String(x);if(!seen[x]&&w.length<3){seen[x]=1;w.push(x)}});

+'<div class="card"><h3>Families</h3><table><tr><th>Group</th><th>Family</th><th>Valence e\u207b</th><th>Ion</th></tr>'
+'<tr><td>1</td><td>Alkali metals</td><td>1</td><td>1+</td></tr><tr><td>2</td><td>Alkaline earth metals</td><td>2</td><td>2+</td></tr>'
+'<tr><td>3-12</td><td>Transition metals</td><td>varies</td><td>varies</td></tr><tr><td>17</td><td>Halogens</td><td>7</td><td>1\u2212</td></tr>'
+'<tr><td>18</td><td>Noble gases</td><td>8 (He 2)</td><td>none</td></tr><tr><td>bottom rows</td><td>Lanthanides / actinides (inner transition)</td><td>varies</td><td></td></tr></table></div>'
+'<div class="card"><h3>Periodic trends</h3><table class="arrowtbl"><tr><th></th><th>Across \u2192</th><th>Down \u2193</th><th>Why</th></tr>'
+'<tr><td>Atomic radius</td><td class="down">decreases</td><td class="up">increases</td><td>across: more protons pull harder; down: more shells</td></tr>'
+'<tr><td>Ionization energy</td><td class="up">increases</td><td class="down">decreases</td><td>small atoms hold electrons tighter</td></tr>'
+'<tr><td>Electronegativity</td><td class="up">increases</td><td class="down">decreases</td><td>fluorine is highest; noble gases not assigned</td></tr></table></div>'
+'<div class="card"><h3>Flame test colors</h3><p>Li red/crimson &middot; Na yellow-orange &middot; K lilac &middot; Ca orange-red &middot; Sr red &middot; Cu green/blue-green &middot; Ba pale yellow-green</p><p class="tiny">Textbook colors, not on the BAT sheet. Your own lab data table wins if it\u2019s different.</p></div>'
+'<div class="note">The BAT sheet says to expect earlier topics too. The <a href="chem3.html">Unit 3 trainer</a> (Atomic Structure) and <a href="chem.html">Unit 2 trainer</a> are still there for review.</div>';
