<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Study Hub</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--ink:#e8eaf0;--dim:#9aa3b2;
--accent:#5b8cff;--good:#3ecf8e;--warn:#ffb020;--bad:#ff5c5c;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,17,21,.97);backdrop-filter:blur(10px);z-index:30}
h1{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.syncdot{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s}
.syncdot.ok{background:var(--good)}.syncdot.busy{background:var(--warn)}.syncdot.err{background:var(--bad)}
.sub{color:var(--dim);font-size:11.5px;margin-top:2px}
nav{display:flex;gap:5px;margin-top:10px;overflow-x:auto}
nav::-webkit-scrollbar{display:none}
nav button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap;flex-shrink:0}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:760px;margin:0 auto;padding:14px 14px calc(70px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:14.5px}
.card p{margin:0 0 7px;color:#cdd4e0;font-size:13.5px}
a{color:var(--accent)}
.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:7px 12px;border-radius:7px;font-size:13px;cursor:pointer;text-decoration:none;margin:3px 4px 0 0}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{border-color:rgba(255,92,92,.5);color:#ffb3b3}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:8px;font-size:14px;font-family:inherit;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.addwrap{margin-bottom:12px}
.parsed{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;margin-top:8px}
.parsed .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.parsed label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12px;color:var(--dim);margin:2px 3px 0 0}
.chip b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.task{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:9px;padding:11px 13px;margin-bottom:7px;display:flex;gap:11px;align-items:flex-start}
.task.overdue{background:rgba(255,92,92,.06)}
.task .cb{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;cursor:pointer;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent}
.task .cb:hover{border-color:var(--good)}
.task.done .cb{background:var(--good);border-color:var(--good);color:#0f1115}
.task.done .ttl{text-decoration:line-through;color:var(--dim)}
.task .body{flex:1;min-width:0}
.ttl{font-size:14px;font-weight:500;word-wrap:break-word}
.meta{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.meta .due.od{color:var(--bad);font-weight:600}
.meta .due.today{color:var(--warn);font-weight:600}
.note2{font-size:11.5px;color:var(--warn);margin-top:3px;font-style:italic}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:18px 0 8px;font-weight:600}
h2.sec span{opacity:.6;font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
th{background:var(--panel2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.empty{color:var(--dim);font-size:13.5px;text-align:center;padding:22px 10px}
.note{background:rgba(255,176,32,.09);border:1px solid rgba(255,176,32,.3);border-radius:9px;padding:11px 14px;margin-bottom:10px;font-size:13px;color:#e6d9bd}
.note.red{background:rgba(255,92,92,.09);border-color:rgba(255,92,92,.3);color:#f0cfcf}
.note.green{background:rgba(62,207,142,.09);border-color:rgba(62,207,142,.3);color:#c9ecdc}
.hintline{font-size:11.5px;color:var(--dim);margin-top:5px}
.tiny{font-size:11px;color:var(--dim)}
details summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;padding:3px 0}
</style>
</head>
<body>
<header>
  <h1>Study Hub <span class="syncdot" id="sdot" title="sync"></span></h1>
  <div class="sub" id="hdr">loading…</div>
  <nav>
    <button class="on" data-v="today">Today</button>
    <button data-v="all">All Work</button>
    <button data-v="grades">Grades</button>
    <button data-v="cleared">Cleared</button>
    <button data-v="study">Study</button>
    <button data-v="settings">Settings</button>
  </nav>
</header>
<main>
<section class="view on" id="today"></section>
<section class="view" id="all"></section>
<section class="view" id="grades"></section>
<section class="view" id="cleared"></section>
<section class="view" id="study"></section>
<section class="view" id="settings"></section>
</main>
<script>
/* ===================== CLOUD SYNC ===================== */
const SB_URL='https://qfgvtrifvgtttvlaspqn.supabase.co';
const SB_KEY='sb_publishable_H3HI2vdy2okpATAjXR75Kw_LcGHFblP';
const SB_ROW='james';
const H=()=>({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'});
let DATA={classes:[],assignments:[],powerschool:[],grades:[],generated:null};
/* the one synced document */
let S={dismissed:{},tasks:[],alias:{}};
const cacheGet=()=>{try{return JSON.parse(localStorage.getItem('hub.cache'))}catch(e){return null}};
const cacheSet=()=>localStorage.setItem('hub.cache',JSON.stringify(S));
function dot(c){const d=document.getElementById('sdot');d.className='syncdot '+c}
function mergeState(a,b){
  const out={dismissed:{...(a.dismissed||{}),...(b.dismissed||{})},alias:{...(a.alias||{}),...(b.alias||{})},tasks:[]};
  const seen={};[...(a.tasks||[]),...(b.tasks||[])].forEach(t=>{if(!seen[t.id]){seen[t.id]=1;out.tasks.push(t)}});
  return out;
}
async function pull(){
  dot('busy');
  try{
    const r=await fetch(SB_URL+'/rest/v1/hub_state?id=eq.'+SB_ROW+'&select=data',{headers:H(),cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    const remote=(j[0]&&j[0].data)||{};
    S=mergeState(S,remote);
    cacheSet();dot('ok');return true;
  }catch(e){dot('err');return false}
}
let pushT=null;
function push(){
  clearTimeout(pushT);dot('busy');cacheSet();
  pushT=setTimeout(async()=>{
    try{
      const r=await fetch(SB_URL+'/rest/v1/hub_state?on_conflict=id',{method:'POST',
        headers:{...H(),Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify({id:SB_ROW,data:S,updated_at:new Date().toISOString()})});
      dot(r.ok?'ok':'err');
    }catch(e){dot('err')}
  },700);
}

/* ===================== UTIL ===================== */
const uid=()=>Math.random().toString(36).slice(2,9);
const K=t=>(t.cls||'Personal')+'|'+t.title;            /* stable key, survives id renumbering */
const isCleared=t=>!!S.dismissed[K(t)];
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dayDiff(due){if(!due)return null;return Math.round((startOfDay(new Date(due))-startOfDay(new Date()))/864e5)}
function dueLabel(due){
  if(!due)return{txt:'no due date',cls:''};
  const n=dayDiff(due),d=new Date(due);
  const time=(d.getHours()!==23||d.getMinutes()!==59)?' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';
  if(n<0)return{txt:Math.abs(n)+'d past due',cls:'od'};
  if(n===0)return{txt:'due today'+time,cls:'today'};
  if(n===1)return{txt:'due tomorrow'+time,cls:'today'};
  if(n<7)return{txt:'due '+d.toLocaleDateString([],{weekday:'long'})+time,cls:''};
  return{txt:'due '+d.toLocaleDateString([],{month:'short',day:'numeric'}),cls:''};
}
function colorOf(n){const c=DATA.classes.find(c=>c.name===n);return c?c.color:'#6b7280'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function allTasks(){return [...DATA.assignments.map(a=>({...a,src:'classroom'})),...S.tasks.map(t=>({...t,src:'mine'}))]}
function psAll(){return (DATA.powerschool||[])}
function psB(b){return psAll().filter(p=>p.bucket===b&&!isCleared(p))}

function clear_(t,note){
  const k=K(t);
  if(S.dismissed[k])delete S.dismissed[k];
  else S.dismissed[k]={at:new Date().toISOString(),note:note||null,cls:t.cls,title:t.title};
  push();refresh();
}

/* ===================== NL PARSER ===================== */
const LEAD=/^(please\s+)?(remind me(?: to)?|remember(?: to)?|don'?t forget(?: to)?|dont forget(?: to)?|i need to|i have to|i gotta|gotta|need to|have to|make sure i|add task|add|todo:?|to ?do:?|new task)\s+/i;
const KINDW=[[/\b(test|exam|quiz|prueba)\b/i,'test'],[/\b(read|annotat|chapter|ch\.|novel|gatsby)\b/i,'reading'],
 [/\b(lab|experiment)\b/i,'lab'],[/\b(cyu|check for understanding|problem set)\b/i,'cyu'],
 [/\b(video|watch|khan|crash course)\b/i,'video'],[/\b(slide|presentation|project|essay|paper|write)\b/i,'project'],
 [/\b(membean|grammar ?flip|lingt|duolingo|lingo|conjuguemos|blooket|gimkit|drill|vocab)\b/i,'drill']];
const WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MO=['january','february','march','april','may','june','july','august','september','october','november','december'];
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function parse(raw){
  let s=raw.trim().replace(LEAD,'').trim();const orig=s;
  let due=null,dueTxt=null,cls=null,m;
  const set=(d,l)=>{d.setHours(23,59,0,0);due=d;dueTxt=l};
  if(/\b(today|tonight)\b/i.test(s)){set(new Date(),'today');s=s.replace(/\b(today|tonight)\b/ig,' ')}
  else if(/\btomorrow\b/i.test(s)){const d=new Date();d.setDate(d.getDate()+1);set(d,'tomorrow');s=s.replace(/\btomorrow\b/ig,' ')}
  else if((m=s.match(/\bin (\d{1,2}) days?\b/i))){const d=new Date();d.setDate(d.getDate()+ +m[1]);set(d,'in '+m[1]+' days');s=s.replace(m[0],' ')}
  else if(/\bnext week\b/i.test(s)){const d=new Date();d.setDate(d.getDate()+7);set(d,'next week');s=s.replace(/\bnext week\b/ig,' ')}
  else if((m=s.match(new RegExp('\\b(?:by |on |due |this )?('+WD.join('|')+')\\b','i')))){
    const t=WD.indexOf(m[1].toLowerCase()),d=new Date();let a=(t-d.getDay()+7)%7;if(a===0)a=7;
    d.setDate(d.getDate()+a);set(d,m[1]);s=s.replace(m[0],' ')}
  else if((m=s.match(new RegExp('\\b(?:by |on |due )?('+MO.map(x=>x.slice(0,3)).join('|')+')[a-z]*\\.?\\s+(\\d{1,2})\\b','i')))){
    const mi=MO.findIndex(x=>x.startsWith(m[1].toLowerCase()));
    const d=new Date((new Date()).getFullYear(),mi,+m[2]);
    if(d<startOfDay(new Date()))d.setFullYear(d.getFullYear()+1);set(d,m[1]+' '+m[2]);s=s.replace(m[0],' ')}
  else if((m=s.match(/\b(?:by |on |due )?(\d{1,2})\/(\d{1,2})\b/))){
    const d=new Date((new Date()).getFullYear(),+m[1]-1,+m[2]);
    if(d<startOfDay(new Date()))d.setFullYear(d.getFullYear()+1);set(d,m[1]+'/'+m[2]);s=s.replace(m[0],' ')}
  let best=null,hint=null;
  for(const k in S.alias){if(new RegExp('\\b'+rx(k),'i').test(s)&&(!best||k.length>best.k.length))best={k,name:S.alias[k]}}
  DATA.classes.forEach(c=>{
    [...(c.aliases||[]),c.name.toLowerCase()].forEach(a=>{
      if(new RegExp('\\b'+rx(a),'i').test(s)&&(!best||a.length>best.k.length))best={k:a,name:c.name}});
    (c.hints||[]).forEach(hn=>{if(new RegExp('\\b'+rx(hn),'i').test(s)&&!hint)hint={k:hn,name:c.name}});});
  if(best){cls=best.name;s=s.replace(new RegExp('\\b'+rx(best.k),'ig'),' ')}
  else if(hint)cls=hint.name;
  let kind='worksheet';for(const [re,k] of KINDW)if(re.test(orig)){kind=k;break}
  if(!cls){const cs=[...new Set(DATA.assignments.filter(a=>a.kind===kind).map(a=>a.cls))];if(cs.length===1)cls=cs[0]}
  let title=s.replace(/\b(do|the|my|a|an|for|class|hw|homework|assignment|stuff|work|and|some)\b/ig,' ').replace(/\s+/g,' ').trim();
  if(title.replace(/[^a-z0-9]/ig,'').length<2)title=orig.replace(/\s+/g,' ').trim();
  title=title.charAt(0).toUpperCase()+title.slice(1);
  const STOP=new Set(['the','for','and','you','your','are','with','this','that','from','have','about','into','out','get','all','any','can','does','need','want','finish','study','due','next','week','day','days']);
  const words=orig.toLowerCase().split(/\W+/).filter(w=>w.length>2&&!STOP.has(w));
  let match=null,bs=0;
  allTasks().filter(t=>!isCleared(t)&&t.src==='classroom').forEach(a=>{
    const at=a.title.toLowerCase();let sc=words.filter(w=>at.includes(w)).length;
    if(sc===0)return;if(cls&&a.cls===cls)sc+=0.6;else if(cls)sc-=0.6;
    if(sc>bs){bs=sc;match=a}});
  if(bs<1.5)match=null;
  return{title,cls,due,dueTxt,kind,match,raw:orig};
}

/* ===================== ROWS ===================== */
function row(t,o){
  o=o||{};const dl=dueLabel(t.due),col=colorOf(t.cls),cleared=isCleared(t),d=S.dismissed[K(t)];
  return '<div class="task'+(cleared?' done':'')+((dl.cls==='od'&&!cleared&&!o.soft)?' overdue':'')+'" style="border-left-color:'+col+'">'
   +'<div class="cb" onclick="clearPrompt(\''+esc(K(t)).replace(/'/g,"\\'")+'\')">&#10003;</div><div class="body">'
   +'<div class="ttl">'+esc(t.title)+'</div><div class="meta">'
   +'<span class="dot" style="background:'+col+'"></span>'+esc(t.cls||'Personal')
   +'<span class="due '+dl.cls+'">'+dl.txt+'</span>'
   +(t.src==='mine'?'<span class="tiny">yours</span>':'')
   +'</div>'+(cleared&&d&&d.note?'<div class="note2">'+esc(d.note)+'</div>':'')+'</div></div>';
}
function psRow(p,o){
  o=o||{};const col=colorOf(p.cls),cleared=isCleared(p),d=S.dismissed[K(p)];
  const sc=p.score===null?'not graded':p.score+'/'+p.possible+(p.pct!==null?' ('+Math.round(p.pct)+'%)':'');
  return '<div class="task'+(cleared?' done':'')+'" style="border-left-color:'+col+'">'
   +(o.nocheck?'':'<div class="cb" onclick="clearPrompt(\''+esc(K(p)).replace(/'/g,"\\'")+'\')">&#10003;</div>')
   +'<div class="body"><div class="ttl">'+esc(p.title)+'</div><div class="meta">'
   +'<span class="dot" style="background:'+col+'"></span>'+esc(p.cls)
   +'<span>'+(p.due?new Date(p.due+'T12:00').toLocaleDateString([],{month:'short',day:'numeric'}):'no date')+'</span>'
   +'<span'+(p.bucket==='zero'?' class="due od"':'')+'>'+sc+'</span>'
   +(p.cat?'<span class="tiny">'+esc(p.cat)+'</span>':'')
   +'</div>'+(cleared&&d&&d.note?'<div class="note2">'+esc(d.note)+'</div>':'')+'</div></div>';
}
function findByKey(k){
  return allTasks().find(t=>K(t)===k)||psAll().find(p=>K(p)===k);
}
function clearPrompt(k){
  const t=findByKey(k);if(!t)return;
  if(S.dismissed[k]){delete S.dismissed[k];push();refresh();return}
  const why=prompt('Clear "'+t.title+'".\n\nOptional note for future you (why it was a zero, what you did about it):','');
  if(why===null)return;
  S.dismissed[k]={at:new Date().toISOString(),note:why.trim()||null,cls:t.cls,title:t.title};
  push();refresh();
}

/* ===================== VIEWS ===================== */
function addBar(){return '<div class="addwrap"><input id="nl" placeholder="e.g. remind me to do spanish lingo friday" autocomplete="off">'
 +'<div class="hintline">Say it however you want. I work out the class and the due date.</div><div id="preview"></div></div>'}
function wireAdd(){
  const i=document.getElementById('nl');if(!i)return;
  i.oninput=()=>{const v=i.value.trim(),p=document.getElementById('preview');
    if(v.length<3){p.innerHTML='';window.__p=null;return}
    const r=parse(v);window.__p=r;
    p.innerHTML='<div class="parsed"><div class="r"><span class="chip"><span class="dot" style="background:'+colorOf(r.cls)+'"></span><b>'+esc(r.title)+'</b></span></div>'
     +'<div class="r"><label>Class</label><select id="pcls" style="width:auto"><option value="">Personal</option>'
     +DATA.classes.map(c=>'<option'+(c.name===r.cls?' selected':'')+'>'+c.name+'</option>').join('')+'</select>'
     +'<label>Due</label><input id="pdue" type="date" style="width:auto" value="'+(r.due?isoDate(r.due):'')+'"></div>'
     +'<div class="tiny">'+(r.cls?'Class picked up from what you typed. ':'No class spotted &mdash; choose one and I\'ll remember that word. ')
     +(r.due?'Due '+r.dueTxt+'.':'No date found.')
     +(r.match?'<br><b style="color:var(--warn)">Careful: looks like "'+esc(r.match.title)+'" ('+esc(r.match.cls)+'), already in Classroom.</b>':'')+'</div>'
     +'<div style="margin-top:9px"><button class="btn primary sm" onclick="commit()">Add it</button></div></div>'};
  i.onkeydown=e=>{if(e.key==='Enter'&&window.__p)commit()};
}
function isoDate(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function commit(){
  const r=window.__p;if(!r)return;
  const se=document.getElementById('pcls'),de=document.getElementById('pdue');
  const cls=se?se.value:r.cls;let due=null;
  if(de&&de.value)due=new Date(de.value+'T23:59:00').toISOString();
  if(cls&&cls!==r.cls){const w=r.title.toLowerCase().split(/\s+/).filter(x=>x.length>3)[0];if(w)S.alias[w]=cls}
  S.tasks.push({id:uid(),title:r.title,cls:cls||null,due,kind:r.kind,created:new Date().toISOString()});
  push();document.getElementById('nl').value='';document.getElementById('preview').innerHTML='';window.__p=null;refresh();
}

function renderToday(){
  const t=allTasks().filter(x=>!isCleared(x));
  const od=t.filter(x=>x.due&&dayDiff(x.due)<0).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const td=t.filter(x=>x.due&&dayDiff(x.due)===0);
  const soon=t.filter(x=>x.due&&dayDiff(x.due)>0&&dayDiff(x.due)<=3).sort((a,b)=>new Date(a.due)-new Date(b.due));
  const zero=psB('zero');
  const ung=psB('ungraded').filter(p=>p.due&&new Date(p.due+'T12:00')<new Date());
  let h=addBar();
  if(zero.length)h+='<div class="note red"><b>'+zero.length+' actually missing</b> in PowerSchool (scored zero). Tick one off to clear it for good &mdash; it syncs to every device.</div>';
  else h+='<div class="note green">Nothing scored zero in PowerSchool right now.</div>';
  if(zero.length)h+='<h2 class="sec" style="color:var(--bad)">Actually missing <span>'+zero.length+'</span></h2>'+zero.map(p=>psRow(p)).join('');
  if(ung.length)h+='<h2 class="sec">Past due, no grade entered <span>'+ung.length+'</span></h2>'
    +'<div class="tiny" style="margin:-4px 0 7px">Might just be un-graded by the teacher. Worth a glance.</div>'+ung.map(p=>psRow(p)).join('');
  h+='<h2 class="sec">Due today <span>'+td.length+'</span></h2>'+(td.length?td.map(x=>row(x)).join(''):'<div class="empty">Nothing due today.</div>');
  h+='<h2 class="sec">Next 3 days <span>'+soon.length+'</span></h2>'+(soon.length?soon.map(x=>row(x)).join(''):'<div class="empty">Clear.</div>');
  h+='<h2 class="sec">Past due in Classroom <span>'+od.length+'</span></h2>'
   +'<div class="tiny" style="margin:-4px 0 7px">Classroom dates only. Not the same as missing &mdash; PowerSchool above is what counts.</div>'
   +(od.length?od.map(x=>row(x,{soft:1})).join(''):'<div class="empty">Nothing past due.</div>');
  document.getElementById('today').innerHTML=h;wireAdd();
}
function renderAll(){
  const open=allTasks().filter(x=>!isCleared(x)).sort((a,b)=>{if(!a.due)return 1;if(!b.due)return -1;return new Date(a.due)-new Date(b.due)});
  const by={};open.forEach(x=>{const k=x.cls||'Personal';(by[k]=by[k]||[]).push(x)});
  let h=addBar()+'<h2 class="sec">Open <span>'+open.length+'</span></h2>';
  Object.keys(by).sort().forEach(c=>{h+='<h2 class="sec" style="color:'+colorOf(c)+'">'+esc(c)+' <span>'+by[c].length+'</span></h2>'+by[c].map(x=>row(x)).join('')});
  document.getElementById('all').innerHTML=h;wireAdd();
}
function renderGrades(){
  const G=DATA.grades||[];
  const ord={'A+':0,'A':1,'A-':2,'B+':3,'B':4,'B-':5,'C+':6,'C':7,'C-':8,'D+':9,'D':10,'D-':11,'F':12};
  const sorted=G.slice().sort((a,b)=>(ord[b.letter]??6)-(ord[a.letter]??6));
  let h='<div class="card"><h3>Current grades</h3><table><tr><th>Class</th><th>Grade</th><th></th></tr>'
   +sorted.map(g=>{const bad=['D+','D','D-','F','C-','C','C+'].includes(g.letter);
     return '<tr><td><span class="dot" style="background:'+colorOf(g.cls)+'"></span> '+esc(g.cls)+'</td>'
      +'<td><b style="color:'+(bad?'var(--bad)':'var(--good)')+'">'+esc(g.letter)+'</b> '+(g.pct!==null?(g.scale==='points'?g.pct+' pts':g.pct+'%'):'')+'</td>'
      +'<td><a class="tiny" target="_blank" href="https://brebeuf.powerschool.com/guardian/scores.html?frn='+g.frn+'&begdate=08/10/2026&enddate=12/18/2026&fg=S1&schoolid=1000003360">open</a></td></tr>'}).join('')
   +'</table><p class="tiny" style="margin-top:8px">Algebra II is on a points scale, not a percent.</p></div>';
  const low=psB('lowscore');
  if(low.length)h+='<div class="card"><h3>Scores under 60%</h3><p class="tiny">Not missing. You turned these in, they went badly. This is what is actually holding the grade down.</p></div>'+low.map(p=>psRow(p,{nocheck:1})).join('');
  const ff=psAll().filter(p=>p.bucket==='falseflag');
  if(ff.length)h+='<div class="card"><h3>Flagged missing but full credit <span class="tiny">('+ff.length+')</span></h3>'
   +'<p>These show the missing icon in PowerSchool but are scored 100%. The flag was never cleared. <b>You do not owe anything here.</b> All in '+esc([...new Set(ff.map(x=>x.cls))].join(', '))+'.</p>'
   +'<details><summary>Show all '+ff.length+'</summary>'+ff.map(p=>psRow(p,{nocheck:1})).join('')+'</details></div>';
  h+='<div class="card"><h3>How "missing" is decided</h3><ul style="margin:4px 0 0;padding-left:18px;color:#cdd4e0;font-size:13.5px">'
   +'<li><b>Scored 0</b> &rarr; actually missing</li><li><b>Flag + full credit</b> &rarr; ignored, teacher error</li>'
   +'<li><b>Flag + partial credit</b> &rarr; ignored, you turned it in</li><li><b>Past due, no score</b> &rarr; shown as "check this"</li>'
   +'<li>Classroom\'s Missing tab is <b>not used</b></li></ul></div>';
  document.getElementById('grades').innerHTML=h;
}
function renderCleared(){
  const ks=Object.keys(S.dismissed).sort((a,b)=>new Date(S.dismissed[b].at)-new Date(S.dismissed[a].at));
  let h='<div class="card"><h3>Cleared items</h3><p>Things you ticked off. They stay hidden even when PowerSchool keeps reporting them, on every device. Tap one to bring it back.</p></div>';
  if(!ks.length)h+='<div class="empty">Nothing cleared yet.</div>';
  ks.forEach(k=>{const d=S.dismissed[k];
    h+='<div class="task done" style="border-left-color:'+colorOf(d.cls)+'">'
     +'<div class="cb" onclick="clearPrompt(\''+esc(k).replace(/'/g,"\\'")+'\')">&#10003;</div><div class="body">'
     +'<div class="ttl">'+esc(d.title||k)+'</div><div class="meta"><span class="dot" style="background:'+colorOf(d.cls)+'"></span>'+esc(d.cls||'Personal')
     +'<span>cleared '+new Date(d.at).toLocaleDateString([],{month:'short',day:'numeric'})+'</span></div>'
     +(d.note?'<div class="note2">'+esc(d.note)+'</div>':'')+'</div></div>'});
  document.getElementById('cleared').innerHTML=h;
}
function renderStudy(){
  document.getElementById('study').innerHTML=
   '<div class="card"><h3>Test trainers</h3><p>Flashcards, practice tests and reference charts from your teachers\' own notes.</p>'
   +'<a class="btn primary" href="study.html">Chemistry &amp; Religion</a><a class="btn" href="ush.html">US History Unit 1+2</a></div>'
   +'<div class="card"><h3>Jump to a class</h3><div>'+DATA.classes.map(c=>'<a class="btn sm" target="_blank" href="https://classroom.google.com/c/'+c.id+'"><span class="dot" style="background:'+c.color+'"></span> '+esc(c.name)+'</a>').join('')+'</div></div>';
}
function renderSettings(){
  const ks=Object.keys(S.alias);
  document.getElementById('settings').innerHTML=
   '<div class="card"><h3>Sync</h3><p>Tasks and cleared items live in a shared database, so your Mac and your phone see the same thing. The dot next to the title is green when synced.</p>'
   +'<button class="btn" onclick="pull().then(refresh)">Pull now</button><span class="tiny" id="syncinfo"></span></div>'
   +'<div class="card"><h3>Data freshness</h3><p class="tiny">Classroom + PowerSchool last refreshed: <b>'+(DATA.generated?new Date(DATA.generated).toLocaleString():'unknown')+'</b><br>Refreshes automatically at 6:30 AM and 4:30 PM.</p></div>'
   +'<div class="card"><h3>Learned words</h3><p class="tiny">When you correct a class, the word is remembered.</p><div>'+(ks.length?ks.map(k=>'<span class="chip"><b>'+esc(k)+'</b> &rarr; '+esc(S.alias[k])+'</span>').join(''):'<span class="tiny">None yet.</span>')+'</div></div>'
   +'<div class="card"><h3>Reset</h3><button class="btn danger" onclick="if(confirm(\'Erase all your tasks and cleared items everywhere?\')){S={dismissed:{},tasks:[],alias:{}};push();refresh()}">Erase synced data</button></div>';
}

/* ===================== BOOT ===================== */
function go(v){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));
  if(v==='grades')renderGrades();if(v==='cleared')renderCleared();if(v==='settings')renderSettings();if(v==='study')renderStudy();
  window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function refresh(){
  renderToday();renderAll();
  const active=document.querySelector('.view.on');
  if(active){if(active.id==='grades')renderGrades();if(active.id==='cleared')renderCleared();if(active.id==='settings')renderSettings();if(active.id==='study')renderStudy()}
  const open=allTasks().filter(x=>!isCleared(x)).length,miss=psB('zero').length;
  document.getElementById('hdr').innerHTML=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})
   +' &middot; '+open+' open'+(miss?' &middot; <span style="color:var(--bad)">'+miss+' missing</span>':' &middot; <span style="color:var(--good)">nothing missing</span>');
}
async function boot(){
  const c=cacheGet();if(c)S=mergeState(S,c);
  try{DATA=await (await fetch('data.json?t='+Date.now(),{cache:'no-store'})).json()}
  catch(e){document.getElementById('today').innerHTML='<div class="note red">Could not load data.json.</div>';return}
  refresh();await pull();refresh();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull().then(refresh)});
window.addEventListener('focus',()=>pull().then(refresh));
setInterval(()=>{if(!document.hidden)pull().then(refresh)},120000);
boot();
</script>
</body>
