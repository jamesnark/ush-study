function chg(stem,c){
  const from=c.split(">")[0],to=c.split(">")[1],i=stem.lastIndexOf(from);
  return stem.slice(0,i)+to+stem.slice(i+from.length);
}
function conj(inf,c,yo){
  const st=inf.slice(0,-2),ty=inf.slice(-2);
  return END[ty].map(function(e,i){
    if(i===0&&yo)return yo;
    return ((c&&[0,1,2,5].indexOf(i)>=0)?chg(st,c):st)+e;
  });
}

function numEs(n){
  if(n<30)return U30[n];
  if(n<100){const t=Math.floor(n/10),u=n%10;return TENS[t]+(u?" y "+U30[u]:"")}
  if(n===100)return "cien";
  if(n<1000){const h=Math.floor(n/100),r=n%100;return HUN[h]+(r?" "+numEs(r):"")}
  const th=Math.floor(n/1000),r=n%1000;return (th===1?"mil":numEs(th)+" mil")+(r?" "+numEs(r):"");
}

  return {g:g,topic:topic,q:q,choices:shuf([{label:String(ans),right:true}].concat(w.map(function(x){return{label:x,right:false}}))),why:why,nwrong:w.length};

  if(pool.length<n)pool=pool.concat(shuf(VOC.filter(function(o){return o!==it&&!overlaps(it,o)&&pool.indexOf(o)<0})));

function buildBank(){
  let out=[];
  VOC.forEach(function(it){out=out.concat(vocabQs(it))});
  Object.keys(VT).forEach(function(k){out=out.concat(conjQs(VT[k]))});
  PROGV.forEach(function(v){out.push(progQ(v))});
  DOP.forEach(function(x,i){out.push(dopQ(x,i))});
  CMDS.forEach(function(c,i){out=out.concat(cmdQs(c,i))});
  CMDP.forEach(function(c,i){out=out.concat(cmdpQs(c,i))});
  IRS.forEach(function(x,i){out.push(irQs(x,i))});
  IRP.forEach(function(x,i){out.push(irpQ(x,i))});
  DEMN.forEach(function(it){out.push(demQ(it,pick(["this","that","over"])))});
  DEMS.forEach(function(x,i){out.push(demSQ(x,i))});
  SE.forEach(function(x,i){out.push(seQ(x,i))});
  NUMS.forEach(function(n){out.push(numQ(n));out.push(numRQ(n))});
  out=out.concat(dayQs());
  BANKC.forEach(function(b){out.push(bankC(b))});
  return out.filter(function(q){return q.nwrong>=2});
}

const SUBJ=/^(yo|tú|tu|él|ella|usted|ud|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes|uds)\s+/;
const SUBJNA=/^(yo|tu|el|ella|usted|ud|nosotros|nosotras|vosotros|vosotras|ellos|ellas|ustedes|uds)\s+/;
function norm(s,keepAcc){
  s=String(s).toLowerCase().replace(/[¡!¿?.,;:"“”«»]/g," ").replace(/\s+/g," ").trim();
  if(!keepAcc)s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").normalize("NFC");
  return s;
}
const ART=/^(el|la|los|las)\s+/;
function check(input,item,opt){
  const raw=String(input);let acc=item.acc.slice();
  function variants(list){const out=[];list.forEach(function(a){out.push(a);if(item.subj&&SUBJ.test(norm(a,true)))out.push(norm(a,true).replace(SUBJ,""))});return out}
  let inp=norm(raw,true);
  if(item.subj)inp=inp.replace(SUBJ,"");
  const V=variants(acc);
  if(V.some(function(a){return norm(a,true)===inp}))return {k:"ok"};
  const inpNA=item.subj?norm(raw,false).replace(SUBJNA,""):norm(raw,false);
  if(V.some(function(a){return norm(a,false)===inpNA||norm(a,false).replace(SUBJNA,"")===inpNA}))return {k:opt.acc?"accent":"okAccent"};
  if(item.noun){
    const bare=inp.replace(ART,""),bareNA=inpNA.replace(ART,"");
    const hasArt=ART.test(inp);
    if(V.some(function(a){return norm(a,true).replace(ART,"")===bare}))return hasArt?{k:"article"}:{k:opt.art?"noArt":"okNoArt"};
    if(V.some(function(a){return norm(a,false).replace(ART,"")===bareNA}))return hasArt?{k:"article"}:{k:opt.art?"noArt":"okNoArt"};
  }
  return {k:"no"};
}

}

function setMiss(id,v){const m=WMISS();if(v)m[id]=(m[id]||0)+1;else delete m[id];localStorage.setItem("spa.wmiss",JSON.stringify(m))}
let W={list:[],pos:0,score:0,done:0,missed:[],answered:false};
const wopt=function(){return {acc:localStorage.getItem("spa.wacc")!=="0",art:localStorage.getItem("spa.wart")!=="0"}};
function wPool(){const sel=selOf("spa.wfocus");return wItems().filter(function(x){return inSel(sel,x.g)})}
function wStart(onlyMiss){
  const n=parseInt(localStorage.getItem("spa.wcount")||"20",10),miss=WMISS();
  let list;
  if(onlyMiss)list=shuf(wItems().filter(function(x){return miss[x.id]}));
  else{
    const pool=wPool(),m=shuf(pool.filter(function(x){return miss[x.id]})),rest=shuf(pool.filter(function(x){return !miss[x.id]}));
    /* up to a third of the set is stuff you missed before, the rest is fresh */
    list=n>=999?shuf(pool):shuf(m.slice(0,Math.ceil(n/3)).concat(rest).slice(0,n));
  }
  W={list:list,pos:0,score:0,done:0,missed:[],answered:false};
  wDraw();
}
function wDraw(){
  const b=$("wrBody");
  if(!W.list.length){b.innerHTML='<div class="empty">Nothing to ask in those segments. Pick something above.</div>';return}
  if(W.pos>=W.list.length){
    b.innerHTML='<div class="wq"><h3 style="margin:0 0 6px">Done: '+W.score+' / '+W.list.length+'</h3>'
     +(W.missed.length?'<p class="tiny">Missed ones (they come back first next time):</p><ul class="wsum">'+W.missed.map(function(m){return '<li>'+m.it.p+' &rarr; <b>'+esc(m.it.show)+'</b> <span class="tiny">you wrote: '+esc(m.you||'(blank)')+'</span></li>'}).join('')+'</ul>'
       +'<button class="btn primary" id="wRedo">Redo just these '+W.missed.length+'</button> ':'<p>Perfect run.</p>')
     +'<button class="btn" id="wNew">New set</button></div>';
    if($("wRedo"))$("wRedo").onclick=function(){W={list:shuf(W.missed.map(function(m){return m.it})),pos:0,score:0,done:0,missed:[],answered:false};wDraw()};
    $("wNew").onclick=function(){wStart(false)};return;
  }
  const it=W.list[W.pos];W.answered=false;
  b.innerHTML='<div class="wq"><div class="wtop"><span>'+esc(GBY[it.g].label)+' &middot; '+(W.pos+1)+' / '+W.list.length+'</span><span>Score <b>'+W.score+' / '+W.done+'</b></span></div>'
   +'<div class="wprompt">'+it.p+'</div>'
   +'<input class="winput" id="wIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type it in Spanish">'
   +'<div class="keys">'+["á","é","í","ó","ú","ñ","ü","¿","¡"].map(function(k){return '<button data-k="'+k+'">'+k+'</button>'}).join('')+'</div>'
   +'<div class="row"><button class="btn primary" id="wChk">Check (Enter)</button><button class="btn" id="wSkip">I don\u2019t know</button></div><div id="wRes"></div></div>';
  const inp=$("wIn");inp.focus();
  [].forEach.call(b.querySelectorAll('.keys button'),function(k){k.onclick=function(){const s=inp.selectionStart||inp.value.length;inp.value=inp.value.slice(0,s)+k.dataset.k+inp.value.slice(inp.selectionEnd||s);inp.focus();inp.setSelectionRange(s+1,s+1)}});
  inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();if(W.answered)next();else grade()}};
  $("wChk").onclick=function(){if(W.answered)next();else grade()};
  $("wSkip").onclick=function(){if(!W.answered){inp.value="";grade(true)}};
  function next(){W.pos++;wDraw()}
  function grade(skip){
    W.answered=true;W.done++;
    const r=skip?{k:"no"}:check(inp.value,it,wopt());
    const good=r.k==="ok"||r.k==="okAccent"||r.k==="okNoArt";
    const msg={ok:"Right.",okAccent:"Counted (accents are off), but watch the accent.",okNoArt:"Counted (articles are off), but the quiz wants el / la.",
      accent:"Almost: check the accent / ñ.",article:"Wrong article (el / la).",noArt:"Right word, but you need the article (el / la / los / las).",no:skip?"Here it is:":"Not quite."}[r.k];
    if(good){W.score++;setMiss(it.id,false)}else{setMiss(it.id,true);W.missed.push({it:it,you:inp.value})}
    if($("wMiss"))wOpts();
    const sb=b.querySelector('.wtop b');if(sb)sb.textContent=W.score+' / '+W.done;
    $("wRes").innerHTML='<div class="wres '+(good?(r.k==="ok"?"ok":"half"):(r.k==="no"?"no":"half"))+'">'+msg
     +'<div class="ans">'+esc(it.show)+'</div>'
     +(it.acc.length>1?'<div class="why2">Also accepted: '+esc(it.acc.filter(function(a){return norm(a,true)!==norm(it.show,true)}).join(" · "))+'</div>':'')
     +(it.why?'<div class="why2">'+esc(it.why)+'</div>':'')
     +(!good?'<div class="row"><button class="btn sm" id="wOver">I had it right, count it</button></div>':'')
     +'<div class="tiny" style="margin-top:6px">Press Enter for the next one.</div></div>';
    if($("wOver"))$("wOver").onclick=function(){W.score++;const sb2=b.querySelector('.wtop b');if(sb2)sb2.textContent=W.score+' / '+W.done;setMiss(it.id,false);W.missed.pop();this.disabled=true;this.textContent="Counted";inp.focus()};
    $("wChk").textContent="Next (Enter)";inp.readOnly=true;inp.focus();
  }
}
const wTop=function(){const n=localStorage.getItem("spa.wcount")||"20",o=wopt(),nm=Object.keys(WMISS()).length;
  return '<div class="opts"><label>Questions <select id="wCount" style="width:auto">'+["10","20","30","50","999"].map(function(v){return '<option value="'+v+'"'+(v===n?' selected':'')+'>'+(v==="999"?"all":v)+'</option>'}).join('')+'</select></label>'
   +'<label><input type="checkbox" id="wAcc"'+(o.acc?' checked':'')+'> accents count</label><label><input type="checkbox" id="wArt"'+(o.art?' checked':'')+'> need el / la on nouns</label></div>'
   +'<div class="row"><button class="btn primary" id="wGo">Start</button><button class="btn" id="wMiss"'+(nm?'':' disabled')+'>Just my misses ('+nm+')</button></div>'};
function wOpts(){
  const h=$("wOptsHost");h.innerHTML=wTop();
  $("wCount").onchange=function(){localStorage.setItem("spa.wcount",this.value)};
  $("wAcc").onchange=function(){localStorage.setItem("spa.wacc",this.checked?"1":"0")};
  $("wArt").onchange=function(){localStorage.setItem("spa.wart",this.checked?"1":"0")};
  $("wGo").onclick=function(){wStart(false)};$("wMiss").onclick=function(){wStart(true)};
}
$("wrSetup").innerHTML='<div id="wPickHost"></div><div id="wOptsHost"></div>';
picker($("wPickHost"),"spa.wfocus",function(){},function(){return wPool().length+' typed questions'},'');
wOpts();
$("wrBody").innerHTML='<div class="empty">Pick segments and hit Start. This tab works like the written quizzes: you type the Spanish, spelling and accents count. Missed ones come back first next time (saved on this device).</div>';

/* =====================================================================
   REFERENCE
   ===================================================================== */
function vtable(S){return '<details'+(S.soon?'':'')+'><summary>'+esc(S.s)+(S.soon?'<span class="soonTag">coming up</span>':'')+' &middot; '+S.items.length+'</summary><table>'
  +S.items.map(function(it){return '<tr><td class="es">'+esc(it.es)+'</td><td>'+esc(it.en)+(it.acc&&it.acc.length>1?'<br><span class="tiny">also: '+esc(it.acc.filter(function(a){return a!==it.es}).join(", "))+'</span>':'')+'</td></tr>'}).join('')
  +'</table><p class="tiny">Source: '+esc(S.src)+'</p></details>'}
function ctable(k){const v=VT[k];return '<tr><td><b>'+k+'</b>'+(v.c?' <span class="tiny">'+v.c.replace(">","&gt;")+'</span>':'')+'</td>'+v.f.map(function(f){return '<td>'+f+'</td>'}).join('')+'</tr>'}
const NTERMS=VOC.filter(function(it){return !it.sec.soon}).length,NSOON=VOC.length-NTERMS;
$("ref").innerHTML=
 '<div class="card"><h3>What\u2019s coming</h3>'
+'<p><b>Final exam: Thursday, December 17.</b> From the Nov 9 slides (\u201cEs el 17 de diciembre. ¿Cuándo es el examen final?\u201d). No Classroom assignment for it yet.</p>'
+'<p>The same slide lists what she plans to teach <b>before the final</b>: IR + infinitivo (done Nov 9), vocabulario de la casa (started Nov 13), adjetivos demostrativos (done Nov 11-13), <b>adjetivos posesivos, los comparativos, el pretérito de verbos regulares</b> (not taught yet). The rest of the Unit 2 vocab sets are in here marked <i>coming up</i>.</p>'
+'<p><b>How her quizzes have looked:</b> Quiz #1 (Sep 1): 20 points, written, <b>short answer</b>, LingCo vocab + class slides. Quiz #2 (Sep 22): 20 points: regular -ar/-er/-ir, present progressive, stem-changers (\u201cwhat are the 3 steps?\u201d), seguridad digital + redes sociales vocab, \u201cknow what these terms mean <b>and how to spell them</b>.\u201d Oral quiz (Nov 3): 5 questions &times; 3 points (understanding, vocab + grammar, pronunciation). That\u2019s why the <b>Write It</b> tab exists: it\u2019s the closest thing to her format.</p></div>'
+'<div class="card"><h3>Heads up: spots where the class materials disagree</h3>'
+'<div class="flag"><b>Ciento mil</b>: the Oct 8 number sheet prints CIENTO MIL for 100,000. The correct form is <b>cien mil</b>.</div>'
+'<div class="flag"><b>Aquella escuela</b>: the Nov 11 and Nov 13 answer slides say \u201cthat house over there\u201d. It means <b>that school over there</b>.</div>'
+'<div class="flag"><b>La terraza</b>: the Nov 13 slide translates it as Patio; the LingCo book says <b>terrace</b>. Know both.</div>'
+'<div class="flag"><b>Later / beforehand</b>: LingCo says después = later and antes = beforehand. The class worksheet uses más tarde and de antemano. Both are in here.</div>'
+'<div class="flag"><b>El profe los habla</b>: one Sep 25 slide answer uses los with hablar a. With hablar, Spanish normally uses les (an indirect object, not taught yet). I left those sentences out of the drills.</div></div>'
+'<div class="card"><h3>Verb charts</h3><table><tr><th>verb</th><th>yo</th><th>tú</th><th>él/ella/Ud.</th><th>nosotros</th><th>vosotros</th><th>ellos/Uds.</th></tr>'
+["ser","estar","ir","tener","decir","pensar","querer","empezar","preferir","poder","dormir","pedir","repetir","jugar","estudiar","comer","vivir"].map(ctable).join('')+'</table>'
+'<p class="tiny">Stem-changers: the boot (yo, tú, él, ellos) changes; nosotros and vosotros keep the original stem.</p></div>'
+'<div class="card"><h3>Direct object pronouns</h3><table><tr><th></th><th>singular</th><th>plural</th></tr><tr><td>1st</td><td>me</td><td>nos</td></tr><tr><td>2nd</td><td>te</td><td>os</td></tr><tr><td>3rd</td><td>lo / la</td><td>los / las</td></tr></table>'
+'<p>Before the conjugated verb (Yo <b>lo</b> tengo) or attached to an infinitive / -ando (Voy a subir<b>lo</b>, Estoy preparándo<b>la</b>).</p></div>'
+'<div class="card"><h3>Commands</h3><table><tr><th>verb</th><th>affirmative</th><th>negative</th></tr>'
+CMDS.slice(0,14).map(function(c){return '<tr><td>'+c[0]+'</td><td>¡'+cap(c[1])+'!</td><td>¡'+cap(c[2])+'!</td></tr>'}).join('')+'</table>'
+'<p>With pronouns: ¡Cómela! / ¡No la comas! &middot; ¡Escríbelo! / ¡No lo escribas! &middot; ¡Háblame! / ¡No me hables! &middot; Irregular from class: ¡Sé! ¡Dime!</p></div>'
+'<div class="card"><h3>Demonstratives</h3><table><tr><th></th><th>m. sing.</th><th>f. sing.</th><th>m. pl.</th><th>f. pl.</th></tr>'
+'<tr><td>this / these</td><td>este</td><td>esta</td><td>estos</td><td>estas</td></tr><tr><td>that / those</td><td>ese</td><td>esa</td><td>esos</td><td>esas</td></tr><tr><td>over there</td><td>aquel</td><td>aquella</td><td>aquellos</td><td>aquellas</td></tr></table></div>'
+'<div class="card"><h3>Ser vs estar</h3><p><b>SER = DOCTOR</b>: Description, Occupation, Characteristic, Time, Origin, Relationship.<br><b>ESTAR = PLACE</b>: Position, Location, Action, Condition, Emotion.</p><table><tr><th>adjective</th><th>with ser</th><th>with estar</th></tr>'
+SEADJ.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>'}).join('')+'</table></div>'
+'<div class="card"><h3>Numbers</h3><p>0-29 are one word: dieciséis, veintidós, veintitrés, veintiséis have accents. 31+ use y: treinta y uno. 100 = cien, 101+ = ciento...: ciento treinta y tres. 500 quinientos, 700 setecientos, 900 novecientos. 1,999 = mil novecientos noventa y nueve. 2,726 = dos mil setecientos veintiséis.</p></div>'
+'<div class="card"><h3>All the vocab, by segment</h3><p class="tiny">'+NTERMS+' taught terms + '+NSOON+' coming-up terms from the Unit 2 book.</p>'+SECS.map(vtable).join('')+'</div>'
+'<div class="card"><h3>Where this came from</h3><p class="tiny">LingCo: the 5 assigned Unidad 1 vocab sets (La tecnología, Actividades en línea, ¿Cuándo?, La seguridad digital, Las redes sociales) and the Unidad 1 + 2 student books (vocab summaries and grammar boxes). Classroom: all 33 daily slide decks from Aug 11 to Nov 13, the Unidad 1 vocab worksheet, the present progressive and stem-changing handouts, the numbers sheet, the commands practice form, the Day of the Dead lists, and the quiz instructions. Sra. Anker\u2019s slides from Oct 12-23 aren\u2019t posted, so the oral-quiz practice questions aren\u2019t in here.</p></div>';

/* =====================================================================
   PRINT / PDF vocab sheet
   ===================================================================== */
function prState(){let s;try{s=JSON.parse(localStorage.getItem("spa.print"))||{}}catch(e){s={}}
  return {mode:s.mode||"current",off:s.off||[],blank:!!s.blank,alts:s.alts!==false}}
function prSave(s){localStorage.setItem("spa.print",JSON.stringify(s))}
function prSecs(s){return SECS.filter(function(S){
  const inMode=s.mode==="all"||(s.mode==="current"&&!S.soon)||(s.mode==="upcoming"&&S.soon);
  return inMode&&s.off.indexOf(S.k)<0})}
function drawPrint(){
  const s=prState(),secs=prSecs(s),n=secs.reduce(function(a,S){return a+S.items.length},0);
  const modes=[["current","Current vocab (taught in class)"],["upcoming","Upcoming only"],["all","Both"]];
  const shown=SECS.filter(function(S){return s.mode==="all"||(s.mode==="current"&&!S.soon)||(s.mode==="upcoming"&&S.soon)});
  $("prCtl").innerHTML='<h3 style="margin:0">Printable vocab sheet</h3>'
   +'<p class="tiny" style="margin:4px 0 0">Pick what goes on the sheet, then hit Save as PDF. In the print box choose <b>Save as PDF</b> (or print it). Letter size, two columns.</p>'
   +'<div class="fbar">'+modes.map(function(m){return '<button class="fchip'+(s.mode===m[0]?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>'}).join('')+'</div>'
   +'<div class="fhead">Segments on the sheet (tap to leave one out)</div><div class="fbar">'
   +shown.map(function(S){return '<button class="fchip'+(S.soon?' soon':'')+(s.off.indexOf(S.k)<0?' on':'')+'" data-k="'+S.k+'">'+esc(S.s.replace(/^U(\d) · /,"U$1 "))+'</button>'}).join('')+'</div>'
   +'<div class="opts"><label><input type="checkbox" id="prAlts"'+(s.alts?' checked':'')+'> show other accepted forms</label>'
   +'<label><input type="checkbox" id="prBlank"'+(s.blank?' checked':'')+'> blank English column (quiz yourself)</label></div>'
   +'<div class="row"><button class="btn primary" id="prGo">Save as PDF / Print</button><span class="stat" style="align-self:center">'+n+' words &middot; '+secs.length+' segments</span></div>';
  [].forEach.call($("prCtl").querySelectorAll('[data-m]'),function(b){b.onclick=function(){s.mode=b.dataset.m;s.off=[];prSave(s);drawPrint()}});
  [].forEach.call($("prCtl").querySelectorAll('[data-k]'),function(b){b.onclick=function(){const i=s.off.indexOf(b.dataset.k);if(i>=0)s.off.splice(i,1);else s.off.push(b.dataset.k);prSave(s);drawPrint()}});
  $("prAlts").onchange=function(){s.alts=this.checked;prSave(s);drawPrint()};
  $("prBlank").onchange=function(){s.blank=this.checked;prSave(s);drawPrint()};
  $("prGo").onclick=function(){window.print()};
  const label={current:"Current vocab (taught in class)",upcoming:"Upcoming Unit 2 vocab (not taught yet)",all:"Current + upcoming vocab"}[s.mode];
  $("prSheet").innerHTML=secs.length?'<div class="shd"><b>Spanish II &middot; '+label+'</b><span>Unidad 1 + 2 &middot; '+n+' words &middot; final exam Thu Dec 17 &middot; '+new Date().toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"})+'</span></div>'
   +'<div class="cols">'+secs.map(function(S){return '<div class="blk"><h4>'+esc(S.s)+(S.soon?' <i>(upcoming)</i>':'')+'</h4><table>'
     +S.items.map(function(it){
       const ws=function(x){return x.toLowerCase().split(/[^a-záéíóúüñ]+/).filter(Boolean)},esw=ws(it.es);
       const al=(s.alts&&it.acc&&it.es.indexOf("/")<0)?it.acc.filter(function(a){return a!==it.es&&!ws(a).every(function(w){return esw.indexOf(w)>=0})&&a.replace(/^(el|la|los|las) /,"")!==it.es.replace(/^(el|la|los|las) /,"")}).slice(0,2):[];
       return '<tr><td class="es">'+esc(it.es)+(al.length?' <span class="al">/ '+esc(al.join(", "))+'</span>':'')+'</td><td'+(s.blank?' class="blank"':'')+'>'+esc(it.en)+'</td></tr>'}).join('')
     +'</table></div>'}).join('')+'</div>'
   :'<p style="color:#666">Nothing selected.</p>';
}
drawPrint();
