function drawBox(grid){
  const cw=64,ch=50,cols=Math.max.apply(null,grid.map(r=>r.length)),rows=grid.length;
  const w=cols*cw,h=rows*ch;
  let s='<svg class="pbox" viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px">';
  s+='<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'" rx="10" fill="#12151b" stroke="#2a2f3a"/>';
  grid.forEach(function(row,r){
    row.forEach(function(key,c){
      if(!key||key===".")return;
      const sp=SPECIES[key]; if(!sp)return;
      const cx=c*cw+cw/2, cy=r*ch+ch/2;
      /* bonds first so they sit under the atoms */
      if(sp.atoms.length>1){
        for(let i=1;i<sp.atoms.length;i++){
          s+='<line x1="'+(cx+sp.atoms[0][0])+'" y1="'+(cy+sp.atoms[0][1])+'" x2="'+(cx+sp.atoms[i][0])+'" y2="'+(cy+sp.atoms[i][1])+'" stroke="#5b6270" stroke-width="3"/>';
        }
      }
      sp.atoms.forEach(function(a){
        s+='<circle cx="'+(cx+a[0])+'" cy="'+(cy+a[1])+'" r="'+a[2]+'" fill="'+a[3]+'" stroke="#0f1115" stroke-width="1.5"/>';
        if(a[4])s+='<text x="'+(cx+a[0])+'" y="'+(cy+a[1]+3.5)+'" font-size="9" font-weight="700" text-anchor="middle" fill="#0f1115" font-family="-apple-system,sans-serif">'+a[4]+'</text>';
      });
    });
  });
  return s+'</svg>';
}

   real:"Shallow beach water. It is also why a filter works \u2014 a purely physical separation."},
  {name:"Oil and water",grid:[["oil","oil","oil","oil"],["h2o","h2o","h2o","h2o"]],
   why:"They refuse to mix and settle into separate layers, so where you sample decides what you get.",
   real:"Salad dressing separating in the bottle, and oil floating on seawater after a spill."},
  {name:"Granite",grid:[["qz","fd","mi","qz"],["fd","mi","qz","fd"]],
   why:"Distinct mineral grains you can pick out with your eyes \u2014 quartz, feldspar and mica.",
   real:"Kitchen countertops. The speckles are literally the separate minerals."}
 ]}
};
const NODEMAP={"MATTER":"matter","MIXTURE":"mixture","PURE SUBSTANCE":"pure",
 "HOMOGENEOUS":"homo","HETEROGENEOUS":"hetero","COMPOUND":"compound","ELEMENT":"element"};
function wireFlow(){
  const pre=document.querySelector('#ref .flow');
  if(!pre)return;
  const lines=pre.textContent.split('\n');
  let prevHomo=false;
  const out=lines.map(function(line){
    let l=line.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]});
    const thisHomo=line.indexOf('HOMOGENEOUS')>=0;
    /* the wrapped "HOMOGENEOUS" / "MIXTURE" labels sit on two lines; the MIXTURE
       directly beneath belongs to HOMOGENEOUS, not to the standalone MIXTURE node */
    if(prevHomo&&line.indexOf('MIXTURE')>=0){
      l=l.replace('MIXTURE','<b class="fnode" data-k="homo">MIXTURE</b>');
      prevHomo=false;
      return l;
    }
    prevHomo=thisHomo;
    ["PURE SUBSTANCE","HETEROGENEOUS","HOMOGENEOUS","COMPOUND","ELEMENT","MATTER","MIXTURE"].forEach(function(tok){
      if(l.indexOf('<')>=0&&l.indexOf(tok)<0)return;
      l=l.replace(tok,'<b class="fnode" data-k="'+NODEMAP[tok]+'">'+tok+'</b>');
    });
    return l;
  }).join('\n');
  pre.innerHTML=out;
  const panel=document.createElement('div');panel.id='flowdetail';
  pre.parentNode.appendChild(panel);
  const hint=document.createElement('p');hint.className='tiny';
  hint.style.margin='10px 0 0';
  hint.innerHTML='Tap any <b class="fnode">highlighted box</b> above for three worked examples.';
  pre.parentNode.insertBefore(hint,panel);
  [].forEach.call(pre.querySelectorAll('.fnode'),function(n){
    n.onclick=function(){
      [].forEach.call(pre.querySelectorAll('.fnode'),function(x){x.classList.toggle('sel',x===n)});
      show(n.dataset.k);
    };
  });
  function show(k){
    const e=EX[k];if(!e)return;
    panel.innerHTML='<div class="exwrap"><h3>'+e.title+'</h3><p class="exlead">'+e.lead+'</p>'
      +'<div class="exgrid">'+e.items.map(function(it){
        return '<div class="excard"><div class="exname">'+it.name+'</div>'
         +drawBox(it.grid)
         +'<div class="exwhy">'+it.why+'</div>'
         +'<div class="exreal"><b>Where you meet it:</b> '+it.real+'</div></div>';
      }).join('')+'</div></div>';
    panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}
const FLOWCSS='.flow .fnode{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent);font-weight:700}'
+'.flow .fnode:hover{background:rgba(77,208,225,.14)}'
+'.flow .fnode.sel{background:var(--accent);color:var(--accent-ink);border-bottom-color:transparent}'
+'.exwrap{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}'
+'.exwrap h3{margin:0 0 4px;font-size:16px;color:var(--accent)}'
+'.exlead{margin:0 0 12px;font-size:13.5px;color:#cdd4e0}'
+'.exgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}'
+'.excard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 13px}'
+'.exname{font-size:14px;font-weight:600;margin-bottom:8px}'
+'.pbox{display:block;margin:0 auto 9px}'
+'.exwhy{font-size:12.5px;color:#cdd4e0;line-height:1.5}'
+'.exreal{font-size:12px;color:var(--dim);margin-top:8px;border-top:1px solid var(--line);padding-top:7px;line-height:1.5}';
(function(){var s=document.createElement('style');s.textContent=FLOWCSS;document.head.appendChild(s);})();
wireFlow();

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});
  document.querySelectorAll('.view').forEach(function(v){v.classList.toggle('on',v.id===b.dataset.v)});
  window.scrollTo(0,0);
}});
