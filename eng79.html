/* ---------- CHAPTER 7 ---------- */
{s:"Chapter 7",cat:"event",t:"Gatsby\u2019s new behaviour (start of Ch. 7)",

{s:"Chapter 7",cat:"character",t:"Pammy",

 h:"The only time we see her.",
 d:"<b>Daisy and Tom\u2019s daughter</b>, who appears for the only time in the novel.<br>\u201cAfterward he kept looking at the child with surprise. I don\u2019t think he had ever really believed in its existence before\u201d (117).<br><b>Symbolism:</b> she is living proof of Daisy\u2019s life with Tom \u2014 the past Gatsby wants to erase can\u2019t be erased."},
{s:"Chapter 7",cat:"event",t:"\u201cYou always look so cool\u201d",

{s:"Chapter 7",cat:"symbol",t:"\u201cHer voice is full of money\u201d",
 a:["Who says it?","What does it mean?"],

 d:"<b>Gatsby</b>, about Daisy (120). Nick realizes that\u2019s exactly the charm of her voice \u2014 the jingle of wealth.<br><b>Why it matters:</b> what Gatsby loves about Daisy is tangled up with money and status. <b>Daisy\u2019s voice</b> is on the exam study guide\u2019s list of symbols."},
{s:"Chapter 7",cat:"event",t:"Carpooling into the city",

 h:"Tom takes the yellow car.",

{s:"Chapter 7",cat:"event",t:"Wilson\u2019s garage (Ch. 7)",

{s:"Chapter 7",cat:"event",t:"The Plaza Hotel confrontation",
 a:["What does Gatsby claim about Daisy?","What does Daisy finally say?","What does Tom expose about Gatsby?","Who \u2018wins\u2019?"],
 h:"\u201cPlease, Tom! I can\u2019t stand this any more.\u201d",
 d:"In a stifling suite at the Plaza (\u201cOpen up another window,\u201d Daisy commands, 126), Gatsby insists <b>Daisy never loved Tom</b>.<br>Daisy: \u201cI did love him once \u2014 but I loved you too.\u201d Then: \u201c<b>Please, Tom! I can\u2019t stand this any more</b>\u201d (134).<br>Tom exposes Gatsby\u2019s business: <b>bootlegging</b> through drugstores, with Wolfsheim. \u201cHer frightened eyes told that whatever intentions, whatever courage she had had, were definitely gone\u201d (135) \u2014 <b>Daisy pulls back toward Tom</b>.<br>Tom, confident he\u2019s won, sends Daisy home <b>with Gatsby</b>, to show Gatsby is no threat. It\u2019s also <b>Nick\u2019s 30th birthday</b>."},
{s:"Chapter 7",cat:"event",t:"Myrtle\u2019s death",
 a:["Whose car hits her?","Who was driving?","Did they stop?","Who witnessed it?"],
 h:"The \u201cdeath car.\u201d",
 d:"On the way back, Myrtle runs out into the road toward the yellow car (thinking it\u2019s Tom) and is <b>killed by Gatsby\u2019s yellow car</b>, which <b>doesn\u2019t stop</b>. <b>Michaelis</b>, the neighbour, is the witness.<br><b>Daisy was driving.</b> Gatsby tells Nick he\u2019ll take the blame.<br><b>Going home:</b> Gatsby and Daisy in the yellow car; Tom, Nick and Jordan in Tom\u2019s blue coupe."},
{s:"Chapter 7",cat:"event",t:"End of Ch. 7: the kitchen window",
 a:["Where is Gatsby, and why?","What does Nick see through the window?"],
 h:"Gatsby keeps watch for nothing.",
 d:"Gatsby waits outside the Buchanans\u2019 house all night, \u201cwatching over nothing,\u201d in case Tom hurts Daisy.<br>Nick sees <b>Tom and Daisy at the kitchen table</b> over cold chicken, talking intimately \u2014 they look like they\u2019re <b>conspiring together</b>. Daisy has chosen Tom."},

/* ---------- CHAPTER 8 ---------- */
{s:"Chapter 8",cat:"event",t:"Gatsby tells Nick the truth (Ch. 8)",
 a:["Where and when did he meet Daisy?","What was his situation then?","What happened while he was at war and Oxford?"],
 h:"\u201cJay Gatsby had broken up like glass against Tom\u2019s hard malice\u201d (148).",

{s:"Chapter 8",cat:"event",t:"What Gatsby can\u2019t admit",

 d:"He has a hard time admitting Daisy <b>ever really loved Tom</b> (152) \u2014 \u201cit was just personal.\u201d<br>He\u2019s still waiting for <b>Daisy to call</b>: \u201cI suppose Daisy\u2019ll call too.\u201d He looked at Nick anxiously, hoping Nick would agree (154). She never calls."},
{s:"Chapter 8",cat:"event",t:"Nick\u2019s last words to Gatsby",

{s:"Chapter 8",cat:"event",t:"Nick and Jordan (Ch. 8)",
 a:["Who calls whom?","How does it go?"],
 h:"A phone call that ends badly.",

{s:"Chapter 8",cat:"symbol",t:"Wilson and the eyes (\u201cGod sees everything\u201d)",

 d:"<b>Michaelis</b> stays up all night with grieving Wilson. Wilson stares at the <b>eyes of Dr. T. J. Eckleburg</b> and says \u201c<b>God sees everything</b>.\u201d Michaelis tells him, \u201cThat\u2019s an advertisement.\u201d<br>This is the clearest moment the eyes act as a <b>God figure</b> \u2014 and the point is that there\u2019s no real God watching, only a billboard."},
{s:"Chapter 8",cat:"event",t:"Gatsby\u2019s death",
 a:["How does Wilson find Gatsby?","Where is Gatsby when he dies?","What does Wilson do after?"],
 h:"The first time all summer he uses the pool.",
 d:"Wilson goes looking for the owner of the yellow car, <b>garage to garage</b> (159) \u2014 and in Ch. 9 we learn <b>Tom told him it was Gatsby\u2019s</b>.<br>Gatsby goes into his <b>pool</b> for the first time all summer, still waiting for Daisy\u2019s call. <b>Wilson shoots Gatsby, then himself.</b> Nick: \u201cthe holocaust was complete.\u201d"},

/* ---------- CHAPTER 9 ---------- */
{s:"Chapter 9",cat:"event",t:"Funeral prep",
 a:["Who comes?","Who refuses, and his reason?","What did Tom and Daisy do?"],
 h:"The whiteboard: Gatz and Owl Eyes show.",

{s:"Chapter 9",cat:"character",t:"Henry Gatz",

{s:"Chapter 9",cat:"event",t:"Nick and Jordan end it",

{s:"Chapter 9",cat:"event",t:"Nick sees Tom",
 a:["Where do they meet?","What does Tom admit?","How does Tom justify it?"],

{s:"Chapter 9",cat:"event",t:"\u201cThey were careless people\u201d",

{s:"Chapter 9",cat:"event",t:"Where everyone ends up",
 a:["Gatsby","Myrtle and George","Tom and Daisy","Jordan","Nick"],
 h:"\u201cWhere do the characters end up?\u201d is an annotation focus.",
 d:"<ul><li><b>Gatsby:</b> murdered in his pool</li><li><b>Myrtle:</b> killed by the car; <b>George:</b> murder-suicide</li>"

{s:"Chapter 9",cat:"event",t:"Nick\u2019s opinion of New York / the East",

{s:"Chapter 9",cat:"symbol",t:"The ending: the green light",

/* ---------- SYMBOLS & TERMS (exam study guide) ---------- */
{s:"Symbols & terms",cat:"symbol",t:"Cars",
 a:["Two car moments in Ch. 7-9","What do cars represent?"],
 h:"Careless driving, again and again.",
 d:"Cars are on the exam study guide\u2019s symbol list. Carelessness behind the wheel runs the whole novel: the wreck outside Gatsby\u2019s party (Ch. 3), Jordan\u2019s \u201cbad driver\u201d line, and finally the <b>yellow \u201cdeath car\u201d</b> that kills Myrtle while Daisy drives.<br>They stand for <b>wealth, status and carelessness</b> \u2014 rich people moving fast and leaving damage behind."},
{s:"Symbols & terms",cat:"symbol",t:"Colors: white and yellow/gold",
 a:["What does white suggest, and who wears it?","What does yellow/gold suggest?"],
 h:"Daisy and Jordan in white again in Ch. 7.",
 d:"<b>White</b> (Daisy and Jordan, again at lunch in Ch. 7): <b>purity and innocence on the surface</b>, which the novel shows is false.<br><b>Yellow/gold</b>: <b>wealth and money</b> \u2014 and in Ch. 7, the yellow car becomes the instrument of death, so gold also shades into <b>corruption</b>."},
{s:"Symbols & terms",cat:"litterm",t:"Mood vs. Tone",
 a:["Define each","Which one is what the READER feels?","In Gatsby, tone is whose attitude?"],
 h:"Mood = reader. Tone = narrator.",
 d:"<b>Mood:</b> the feeling created by the author\u2019s word choice and imagery \u2014 <b>what the reader feels</b> (tense, ominous, joyful).<br><b>Tone:</b> the <b>attitude of the author or narrator toward the subject</b>. In Gatsby, that\u2019s <b>Nick\u2019s attitude</b> toward what he\u2019s describing."},
{s:"Symbols & terms",cat:"litterm",t:"Theme vs. Topic",
 a:["Define each","Give a topic and a theme from Gatsby"],
 h:"One word vs. a full statement.",
 d:"<b>Topic:</b> an idea the book discusses, about <b>one word</b> \u2014 disillusionment, wealth, marriage, ambition.<br><b>Theme:</b> the <b>message</b> about that topic \u2014 e.g. \u201cWealth does not bring true happiness,\u201d \u201cThe American Dream is not fully attainable,\u201d \u201cMoral carelessness leads to corruption,\u201d \u201cAppearances often defy reality.\u201d"},
{s:"Symbols & terms",cat:"litterm",t:"Irony (three kinds)",
 a:["Verbal","Dramatic","Situational","One example from Ch. 7-9"],
 h:"She says you only need to RECOGNIZE it.",
 d:"<ul><li><b>Verbal:</b> saying the opposite of what you mean (sarcasm)</li><li><b>Dramatic:</b> the reader knows something characters don\u2019t</li>"
 +"<li><b>Situational:</b> what happens is the opposite of what was expected</li></ul>"
 +"<b>Ch. 7-9 examples:</b> Tom never learns Daisy was driving (<b>dramatic</b>); hundreds went to Gatsby\u2019s parties but almost no one comes to his funeral (<b>situational</b>); Gatsby finally uses his pool on the day he dies (<b>situational</b>)."},
{s:"Symbols & terms",cat:"litterm",t:"Plot diagram for the novel",
 a:["Name the five parts","Where is the climax?","What\u2019s the resolution?"],
 h:"Some argue Ch. 7 has two climaxes.",
 d:"<b>Exposition</b> (Ch. 1: meet everyone) &rarr; <b>Rising action</b> (the parties, the reunion, the affair) &rarr; <b>Climax</b> (Ch. 7: the <b>Plaza confrontation</b> and/or <b>Myrtle\u2019s death</b> \u2014 Mrs. Beresford noted some argue there are two) &rarr; <b>Falling action</b> (Ch. 8: Gatsby\u2019s death) &rarr; <b>Resolution</b> (Ch. 9: the funeral, Nick goes home)."}
];
const CARDS=T.map(function(x){return {s:x.s,t:x.t,h:x.h,d:x.d,a:x.a,cat:x.cat}});

/* ---------- generated questions ---------- */
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
const PEOPLE=["Jay Gatsby","Nick Carraway","Daisy Buchanan","Tom Buchanan","Jordan Baker","George Wilson","Meyer Wolfsheim","Owl Eyes"];
const QUOTES=[
 ["You always look so cool.","Daisy Buchanan"],
 ["Her voice is full of money.","Jay Gatsby"],
 ["Please, Tom! I can't stand this any more.","Daisy Buchanan"],
 ["I need money pretty bad.","George Wilson"],
 ["I just got wised up to something funny the last two days.","George Wilson"],
 ["They're a rotten crowd. You're worth the whole damn bunch put together.","Nick Carraway"],
 ["I suppose Daisy'll call too.","Jay Gatsby"],
 ["God sees everything.","George Wilson"],
 ["Let us learn to show our friendship for a man when he is alive and not after he is dead.","Meyer Wolfsheim"],
 ["The poor son-of-a-bitch.","Owl Eyes"],
 ["They were careless people\u2026 they smashed up things and creatures and then retreated back into their money.","Nick Carraway"],
 ["So we beat on, boats against the current, borne back ceaselessly into the past.","Nick Carraway"]
];
function qQuote(){
  const p=shuf(QUOTES)[0];
  const wrong=shuf(PEOPLE.filter(function(n){return n!==p[1]})).slice(0,3);
  return {topic:"Who said it (Ch. 7-9)",q:"Who says this? &mdash; \u201c"+p[0]+"\u201d",
   choices:shuf([{label:p[1],right:true}].concat(wrong.map(function(w){return{label:w,right:false}}))),
   why:"<b>"+p[1]+"</b>."};
}
function qChapter(){
  const EV=[["Gatsby fires his servants and stops the parties","Chapter 7"],["Daisy says \u201cYou always look so cool\u201d","Chapter 7"],
   ["The confrontation at the Plaza Hotel","Chapter 7"],["Myrtle is killed by the yellow car","Chapter 7"],
   ["Gatsby tells Nick how he met Daisy in Louisville","Chapter 8"],["Wilson says \u201cGod sees everything\u201d","Chapter 8"],
   ["Wilson shoots Gatsby in the pool","Chapter 8"],["Henry Gatz shows Nick the schedule","Chapter 9"],
   ["Owl Eyes comes to the funeral","Chapter 9"],["Tom admits he told Wilson whose car it was","Chapter 9"],
   ["Nick goes home to the Midwest","Chapter 9"]];
  const p=shuf(EV)[0];
  return {topic:"Which chapter (7-9)",q:"Which chapter? &mdash; <b>"+p[0]+"</b>",
   choices:shuf(["Chapter 7","Chapter 8","Chapter 9"].map(function(c){return{label:c,right:c===p[1]}})),
   why:"<b>"+p[1]+"</b>."};
}
function qCar(){
  const Q=[["Who drives Gatsby\u2019s yellow car INTO the city?","Tom"],["Who is driving the yellow car when it hits Myrtle?","Daisy"],
   ["Who drives Tom\u2019s blue coupe into the city?","Gatsby"],["Who rides with Tom in the yellow car into the city?","Nick and Jordan"]];
  const p=shuf(Q)[0];
  const pool=["Tom","Daisy","Gatsby","Nick","Nick and Jordan","Jordan"].filter(function(x){return x!==p[1]});
  return {topic:"Carpooling",q:p[0],
   choices:shuf([{label:p[1],right:true}].concat(shuf(pool).slice(0,3).map(function(w){return{label:w,right:false}}))),
   why:"Into the city: <b>Tom</b> drives the yellow car with Nick and Jordan; <b>Gatsby</b> drives Daisy in Tom\u2019s blue coupe. Coming back: Gatsby and Daisy in the yellow car, with <b>Daisy driving</b> when it hits Myrtle."};
}
function qEnd(){
  const E=[["Tom and Daisy","Leave town right after the deaths, with no address"],["Nick","Goes home to the Midwest"],
   ["Jordan","Says she is engaged to someone else"],["George Wilson","Kills Gatsby, then himself"]];
  const p=shuf(E)[0];
  return {topic:"Where they end up",q:"Where does <b>"+p[0]+"</b> end up?",
   choices:shuf(E.map(function(e){return{label:e[1],right:e[0]===p[0]}})),why:"<b>"+p[0]+"</b>: "+p[1]+"."};
}
function extras(){return shuf([qQuote(),qQuote(),qQuote(),qChapter(),qChapter(),qCar(),qEnd()])}

Flash.mount({host:$("fcHost"),cards:CARDS,deckId:"eng79"});

 '<div class="note">Beat-by-beat, using the page numbers Mrs. Beresford put on her slides. The quiz is <b>short answer and multiple choice</b>. Her Ch. 7 focuses: <b>heat imagery, carpooling, conflict, reactions to conflict, responsibility, \u201cthe hotel and beyond.\u201d</b> Ch. 8: <b>disillusionment, who\u2019s responsible, how Gatsby feels the next morning.</b> Ch. 9: <b>Henry Gatz, where everyone ends up, Nick\u2019s opinion of New York.</b></div>'
+'<div class="card"><h3>Chapter 7 &mdash; The hottest day</h3>'
+'<p><b>The lights go out.</b> Gatsby stops the parties and replaces his servants with Wolfsheim\u2019s people so nobody gossips about Daisy\u2019s visits. He invites Nick to lunch at the Buchanans\u2019 (114).</p>'
+'<p><b>The heat</b> (114-115). \u201cBroiling, almost the last, certainly the warmest, of the summer.\u201d Everyone is irritable. Daisy and Jordan are in <b>white</b> again.</p>'
+'<p><b>Pammy</b> appears (117) and Gatsby stares at her \u2014 he never really believed she existed.</p>'
+'<p><b>\u201cYou always look so cool\u201d</b> (119). Daisy says it to Gatsby and Tom sees what it means. Gatsby: \u201c<b>Her voice is full of money</b>\u201d (120). Tom realizes Nick and Jordan knew (121). Daisy: \u201cLet\u2019s all go to town!\u201d (118).</p>'
+'<p><b>The car swap.</b> Tom drives Gatsby\u2019s <b>yellow</b> car with Nick and Jordan; Gatsby drives Daisy in Tom\u2019s <b>blue</b> coupe.</p>'
+'<p><b>Wilson\u2019s garage</b> (123-125). Wilson needs money to take Myrtle West; he\u2019s found out about an affair, not who. Myrtle sees Tom with Jordan and thinks she\u2019s Daisy.</p>'
+'<p><b>The Plaza</b> (126-135). Stifling suite. Gatsby claims Daisy never loved Tom; Daisy can\u2019t say that. Tom exposes the bootlegging. \u201cPlease, Tom! I can\u2019t stand this any more\u201d (134). Daisy\u2019s courage is gone (135). Tom sends her home with Gatsby. It\u2019s Nick\u2019s 30th birthday.</p>'
+'<p><b>Myrtle dies.</b> The yellow car hits her and doesn\u2019t stop. Michaelis witnesses it. <b>Daisy was driving</b>; Gatsby will take the blame.</p>'
+'<p><b>That night.</b> Gatsby keeps watch outside; through the window Tom and Daisy look like they\u2019re conspiring over cold chicken.</p></div>'
+'<div class="card"><h3>Chapter 8 &mdash; The truth, then the pool</h3>'
+'<p><b>4 a.m.</b> Gatsby has stayed up watching Daisy\u2019s house. Nick urges him to leave town (148). Instead he tells Nick the truth, because \u201cJay Gatsby had broken up like glass against Tom\u2019s hard malice.\u201d</p>'
+'<p><b>Louisville, 1917.</b> A penniless officer falls for a rich girl \u201cgleaming like silver\u201d (150). He goes to war and Oxford; Daisy wants her life decided now and marries Tom.</p>'
+'<p><b>Denial.</b> He can\u2019t accept she loved Tom (152). He waits for her call: \u201cI suppose Daisy\u2019ll call too\u201d (154).</p>'
+'<p><b>Nick\u2019s last words</b> to him: \u201cThey\u2019re a rotten crowd. You\u2019re worth the whole damn bunch put together\u201d (154). <b>Jordan</b> calls Nick at work and it goes badly (155).</p>'
+'<p><b>Wilson.</b> Michaelis sits up with him. Wilson stares at Eckleburg\u2019s eyes: \u201cGod sees everything.\u201d \u201cThat\u2019s an advertisement.\u201d He hunts the yellow car garage to garage (159).</p>'
+'<p><b>The pool.</b> Gatsby swims for the first time all summer. Wilson shoots him, then himself.</p></div>'
+'<div class="card"><h3>Chapter 9 &mdash; Resolution</h3>'
+'<p><b>Funeral prep.</b> Nick can\u2019t find mourners. Wolfsheim can\u2019t \u201cget mixed up in this.\u201d Klipspringer only wants his tennis shoes. <b>Tom and Daisy left right after the deaths</b>, no address.</p>'
+'<p><b>Henry Gatz</b>, Gatsby\u2019s father, arrives with a photo of the house and Jimmy\u2019s boyhood <b>schedule</b> \u2014 <b>Gatsby always had a plan</b>.</p>'
+'<p><b>The funeral.</b> Rain. Only Henry Gatz and <b>Owl Eyes</b> from the parties: \u201cThe poor son-of-a-bitch.\u201d <b>No one cared about Gatsby.</b></p>'
+'<p><b>Jordan</b> says she\u2019s engaged and calls Nick a \u201cbad driver\u201d too. <b>Tom</b> on Fifth Avenue admits he told George. \u201c<b>They were careless people</b>.\u201d</p>'
+'<p><b>Nick goes home.</b> New York is haunted. Last night on Gatsby\u2019s beach: the Dutch sailors, the green light, \u201c<b>boats against the current, borne back ceaselessly into the past</b>.\u201d</p></div>';
