const CARDS=T.map(function(x){return {s:x.s,t:x.t,h:x.h,d:x.d,a:x.a,cat:x.cat}});

/* ---------- generated questions ---------- */
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
const QUOTES=[
 ["I'm p-paralyzed with happiness.","Daisy Buchanan"],
 ["I like large parties. They're so intimate. At small parties there isn't any privacy.","Jordan Baker"],
 ["He's so dumb he doesn't know he's alive.","Tom Buchanan"],
 ["Absolutely real \u2014 have pages and everything. I thought they'd be a durable cardboard.","Owl Eyes"],
 ["Reserving judgements is a matter of infinite hope.","Nick Carraway"]
];
const WHERE=[["Tom Buchanan","East Egg"],["Daisy Buchanan","East Egg"],["Nick Carraway","West Egg"],
 ["Jay Gatsby","West Egg"],["Myrtle Wilson","The Valley of Ashes"],["George Wilson","The Valley of Ashes"]];
const STEAL=[["S","Speech \u2014 what the character says and how"],["T","Thoughts \u2014 private thoughts and feelings"],
 ["E","Effect on others \u2014 how others react to them"],["A","Actions \u2014 what they do"],["L","Looks \u2014 appearance and dress"]];
function qQuote(){
  const p=shuf(QUOTES)[0];
  const names=["Nick Carraway","Daisy Buchanan","Tom Buchanan","Jordan Baker","Jay Gatsby","Myrtle Wilson","Owl Eyes"];
  const wrong=shuf(names.filter(function(n){return n!==p[1]})).slice(0,3);
  return {topic:"Who said it",q:"Who says this? &mdash; \u201c"+p[0]+"\u201d",
   choices:shuf([{label:p[1],right:true}].concat(wrong.map(function(w){return{label:w,right:false}}))),
   why:"<b>"+p[1]+"</b> says it."};
}
function qWhere(){
  const p=shuf(WHERE)[0];
  return {topic:"Who lives where",q:"Where does <b>"+p[0]+"</b> live?",
   choices:shuf(["East Egg","West Egg","The Valley of Ashes"].map(function(x){return{label:x,right:x===p[1]}})),
   why:"<b>"+p[0]+"</b> lives in <b>"+p[1]+"</b>. East Egg = old money (Tom, Daisy). West Egg = new money (Nick, Gatsby). Valley of Ashes = the Wilsons."};
}
function qSteal(){
  const p=shuf(STEAL)[0];
  const wrong=shuf(STEAL.filter(function(x){return x[0]!==p[0]})).slice(0,3);
  return {topic:"STEAL letters",q:"In <b>STEAL</b>, what does the <b>"+p[0]+"</b> stand for?",
   choices:shuf([{label:p[1],right:true}].concat(wrong.map(function(w){return{label:w[1],right:false}}))),
   why:"<b>"+p[0]+"</b> = "+p[1]+". STEAL is the five types of indirect characterization."};
}
function qChapter(){
  const EV=[["Nick has dinner at Tom and Daisy's and the phone keeps ringing","Chapter 1"],
   ["Gatsby reaches toward the green light","Chapter 1"],
   ["Nick visits the Valley of Ashes and meets the Wilsons","Chapter 2"],
   ["Tom breaks Myrtle's nose","Chapter 2"],
   ["Nick meets Owl Eyes in the library","Chapter 3"],
   ["Nick finally meets Gatsby face to face","Chapter 3"],
   ["A car loses a wheel in the driveway after the party","Chapter 3"]];
  const p=shuf(EV)[0];
  return {topic:"Which chapter",q:"Which chapter does this happen in? &mdash; <b>"+p[0]+"</b>",
   choices:shuf(["Chapter 1","Chapter 2","Chapter 3"].map(function(c){return{label:c,right:c===p[1]}})),
   why:"That's <b>"+p[1]+"</b>."};
}
function extras(){return shuf([qQuote(),qQuote(),qWhere(),qSteal(),qChapter(),qChapter()])}

Flash.mount({host:$("fcHost"),cards:CARDS,deckId:"eng"});
Flash.quiz({host:$("qzHost"),cards:CARDS,deckId:"eng",count:20,extras:extras});

$("sum").innerHTML=
'<div class="note"><b>Read this first if you are behind.</b> This is a beat-by-beat walkthrough of what actually happens, with the page numbers Mrs. Beresford used in class. It is a scaffold, not a replacement for the book &mdash; the quiz has <b>short answer</b> as well as multiple choice, and short answer is where not having read shows.</div>'

+'<div class="card"><h3>Chapter 1 &mdash; Meeting everyone</h3>'
+'<p><b>Nick introduces himself</b> (1-3). He quotes his father\u2019s advice about not criticising others, claims he reserves judgement, and tells us he came back from the east last autumn disgusted. So the whole novel is a flashback told by someone who already knows how it ends. He singles out Gatsby as the one person exempt from his scorn.</p>'
+'<p><b>The setting</b> (5). Nick has moved to <b>West Egg</b>, the new-money side, into a small house squeezed beside an enormous mansion. Across the bay is <b>East Egg</b>, old money, where his cousin <b>Daisy</b> lives with <b>Tom Buchanan</b>, whom Nick knew at Yale (6).</p>'
+'<p><b>Dinner at the Buchanans\u2019</b> (8-19). Nick arrives to find <b>Daisy</b> and <b>Jordan Baker</b> in white on a huge couch with the curtains blowing; Tom shuts the windows and the room goes still. Daisy\u2019s first line is \u201cI\u2019m p-paralyzed with happiness.\u201d Tom holds forth about a racist book he\u2019s been reading (12-13). <b>The phone rings</b> (14) and the mood collapses &mdash; Jordan quietly tells Nick it\u2019s Tom\u2019s woman in New York. Daisy tells Nick about her daughter\u2019s birth and says she hopes the girl grows up a <b>beautiful little fool</b>.</p>'
+'<p><b>Gatsby\u2019s name comes up</b> (11) and Jordan reacts as though it means something. Nick leaves \u201cconfused and a little disgusted\u201d (20).</p>'
+'<p><b>The last image</b> (20): Nick sees his neighbour alone on the lawn, trembling, arms stretched toward a <b>green light</b> across the water. He looks away, and Gatsby is gone.</p></div>'

+'<div class="card"><h3>Chapter 2 &mdash; The Valley of Ashes</h3>'
+'<p><b>The Valley of Ashes</b> (23-24). Between West Egg and New York is a grey industrial wasteland where ash piles up like wheat and men move through the dust. Over it hang the enormous blue <b>eyes of Doctor T. J. Eckleburg</b> on a faded billboard.</p>'
+'<p><b>The Wilsons</b> (25-26). Tom drags Nick off the train to meet his mistress. <b>George Wilson</b> runs the garage &mdash; \u201cblond, spiritless, anaemic, and faintly handsome.\u201d He believes Tom is there to sell him a car and has no idea about the affair. <b>Myrtle</b>, his wife, is vivid and physical where Daisy is airy. Tom on George: \u201cHe\u2019s so dumb he doesn\u2019t know he\u2019s alive.\u201d</p>'
+'<p><b>The city</b> (29 onward). Myrtle buys a <b>dog</b> on the way. They go up to the apartment Tom keeps for her, crammed with furniture too big for it. <b>Catherine</b> (Myrtle\u2019s sister) and the <b>McKees</b> from downstairs come up. Catherine passes on gossip about Gatsby and claims Tom and Daisy don\u2019t divorce because Daisy is Catholic &mdash; which is a lie.</p>'
+'<p><b>Everyone drinks.</b> It\u2019s only the second time in his life Nick has been drunk, and he admits he can\u2019t describe the evening fully. He says he was \u201c<b>within and without, simultaneously enchanted and repelled</b>.\u201d</p>'
+'<p><b>The ending.</b> Myrtle starts chanting <b>Daisy\u2019s name</b> at Tom. He tells her she has no right to say it. She says it again, and he <b>breaks her nose</b> with his open hand.</p></div>'

+'<div class="card"><h3>Chapter 3 &mdash; The party</h3>'
+'<p><b>The machine of the parties</b> (39-40). \u201cMen and girls came and went like moths among the whisperings and the champagne and the stars.\u201d Gatsby\u2019s station wagon \u201cscampered like a brisk yellow bug to meet all trains.\u201d Crates of oranges go in and pulp comes out. Nobody is invited &mdash; they simply arrive.</p>'
+'<p><b>Nick actually is invited</b> (41), by a chauffeur in blue, which makes him almost unique among the guests.</p>'
+'<p><b>Nobody knows the host.</b> Nick asks where Gatsby is and gets blank looks. Rumours circulate: he <b>killed a man</b>, he was a <b>German spy</b> in the war, he\u2019s an <b>Oxford man</b>. He finds <b>Jordan</b> (42), leaning back and looking with <i>contemptuous</i> interest into the garden. A girl rips her dress and Gatsby quietly sends her a new one (43).</p>'
+'<p><b>The library</b> (45). <b>Owl Eyes</b> is astonished the books are real, not cardboard &mdash; but the <b>pages are uncut</b>. Nobody has read them.</p>'
+'<p><b>Meeting Gatsby</b> (47-48). Nick chats with a man his own age who turns out to be Gatsby. The famous <b>smile</b>: \u201cone of those rare smiles with a quality of eternal reassurance in it, that you may come across four or five times in life.\u201d He calls Nick \u201cold sport.\u201d He doesn\u2019t drink and doesn\u2019t dance; he watches from the edges (50).</p>'
+'<p><b>Jordan is summoned</b> and comes back saying she\u2019s just heard \u201cthe most amazing thing\u201d but can\u2019t tell Nick yet (49-52).</p>'
+'<p><b>Leaving</b> (53-55). In the driveway a drunk has driven a car into a ditch and lost a wheel, and can\u2019t grasp what happened &mdash; carelessness with machines and with people, which will matter later. The last image is Gatsby alone on the porch, hand raised in farewell, \u201ca sudden emptiness\u201d flowing from the house.</p>'
+'<p><b>Afterward</b> (56-59). Nick describes his ordinary working life in New York, then that he began seeing <b>Jordan</b>, that she is <b>incurably dishonest</b> (the golf-cheating rumour), and that he still has a vague entanglement back home &mdash; right after telling us he is one of the few honest people he knows.</p></div>';
