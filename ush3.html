function bankQ(b){return {topic:b[0],q:b[1],choices:shuf([{label:b[2],right:true}].concat(b[3].map(function(w){return{label:w,right:false}}))),why:b[4]};}
function extras(){
  const gen=[];
  for(let i=0;i<8;i++){gen.push(qLetter());gen.push(qWhich());gen.push(qFromWhom());gen.push(qWhen());gen.push(qHow());}
  for(let i=0;i<3;i++)gen.push(qReaction());
  gen.push(qMissouri());
  const seen={};
  return shuf(BANK.map(bankQ).concat(gen.filter(function(x){if(seen[x.topic])return false;seen[x.topic]=1;return true})));
}
