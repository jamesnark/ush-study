/* ---------- generated questions ---------- */
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
const ELN=["","hydrogen","helium","lithium","beryllium","boron","carbon","nitrogen","oxygen","fluorine","neon","sodium","magnesium","aluminum","silicon","phosphorus","sulfur","chlorine","argon","potassium","calcium","scandium","titanium","vanadium","chromium","manganese","iron","cobalt","nickel","copper","zinc","gallium","germanium","arsenic","selenium","bromine","krypton","rubidium","strontium","yttrium","zirconium","niobium","molybdenum","technetium","ruthenium","rhodium","palladium","silver","cadmium","indium","tin","antimony","tellurium","iodine","xenon","cesium","barium"];
const ELS=["","H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba"];
/* [Z, A, charge] */
const SPECIES=[[6,12,0],[6,14,0],[7,14,0],[7,15,-3],[8,16,0],[8,18,-2],[9,19,-1],[10,21,0],[11,23,1],[12,24,2],[13,27,3],[15,31,0],[16,32,-2],[16,33,0],[17,35,-1],[17,37,0],[19,39,1],[20,40,2],[25,55,2],[26,54,0],[26,56,3],[26,56,2],[28,59,0],[29,63,2],[30,64,2],[33,75,3],[33,75,0],[35,79,-1],[37,85,1],[47,107,1],[4,9,0],[3,7,1],[38,88,2],[53,127,-1]];
function uniq3(ans,cands){const out=[];cands.forEach(function(c){c=String(c);if(c!==String(ans)&&out.indexOf(c)<0&&!/^-/.test(c))out.push(c)});
  if(!isNaN(+ans)){const a=+ans,dec=String(ans).indexOf('.')>=0;[1,2,3,4].forEach(function(k){[a+k,a-k].forEach(function(v){const c=dec?f2(v):String(v);if(out.length<3&&v>=0&&c!==String(ans)&&out.indexOf(c)<0)out.push(c)})})}
  return out.slice(0,3)}
function mcq(topic,q,ans,wrong,why){return {topic:topic,q:q,choices:shuf([{label:String(ans),right:true}].concat(wrong.map(function(w){return{label:w,right:false}}))),why:why}}
function qCount(){
  const s=pick(SPECIES),Z=s[0],A=s[1],ch=s[2],N=A-Z,E=Z-ch,sym=ELS[Z];
  const mode=pick(ch?["n","e","e","p"]:["n","n","p","e"]);
  const label=nuc(A,Z,sym,ch);
  const how="Protons = atomic number = <b>"+Z+"</b>. Neutrons = "+A+" &minus; "+Z+" = <b>"+N+"</b>. Electrons = "+Z+(ch?(ch>0?" &minus; "+ch:" + "+(-ch)):"")+" = <b>"+E+"</b>.";
  if(mode==="n")return mcq("Count neutrons","How many <b>neutrons</b> are in "+label+"?",N,uniq3(N,[Z,A,A+Z,N+1,N-1]),how);
  if(mode==="e")return mcq("Count electrons","How many <b>electrons</b> are in "+label+"?",E,uniq3(E,[Z,ch?Z+ch:Z+1,N,E+1,E-1]),how);
  return mcq("Count protons","How many <b>protons</b> are in "+label+"?",Z,uniq3(Z,[A,N,E,Z+1]),how);
}
function qHyphen(){
  const s=pick(SPECIES.filter(function(x){return x[2]===0})),Z=s[0],A=s[1],N=A-Z;
  const ans=ELN[Z]+"-"+A;
  const c=[ELN[Z]+"-"+N,ELN[Z]+"-"+Z,(ELN[N]||ELN[Z+1])+"-"+A,ELN[Z+1]+"-"+A,ELN[Z-1]+"-"+A,ELN[Z]+"-"+(A+1)];
  return mcq("Hyphen notation","A neutral atom has <b>"+Z+" protons</b> and <b>"+N+" neutrons</b>. What is its hyphen notation?",ans,uniq3(ans,c),
   "The protons make it <b>"+ELN[Z]+"</b> (atomic number "+Z+"). Mass number = "+Z+" + "+N+" = "+A+", so <b>"+ans+"</b>.");
}
function qNuclear(){
  const s=pick(SPECIES),Z=s[0],A=s[1],ch=s[2],sym=ELS[Z];
  const ans=nuc(A,Z,sym,ch);
  const c=[nuc(Z,A,sym,ch),nuc(A,A-Z,sym,ch),ch?nuc(A,Z,sym,-ch):nuc(A+1,Z,sym,0),nuc(A,Z,sym,ch?0:2)];
  const out=[];c.forEach(function(x){if(x!==ans&&out.indexOf(x)<0)out.push(x)});
  const desc=(ch?"a "+(ch>0?"":"")+Math.abs(ch)+(ch>0?"+":"\u2212")+" ion of ":"a neutral atom of ")+"<b>"+ELN[Z]+"-"+A+"</b>";
  return {topic:"Nuclear notation",q:"Which nuclear notation shows "+desc+"?",
   choices:shuf([{label:ans,right:true}].concat(out.slice(0,3).map(function(w){return{label:w,right:false}}))),
   why:"Mass number ("+A+") on top, atomic number ("+Z+") on the bottom"+(ch?", charge top-right":"")+": "+ans+"."};
}

const AVG=[["chlorine",35,75.76,37,24.24],["copper",63,69.15,65,30.85],["boron",10,19.9,11,80.1],["lithium",6,7.59,7,92.41],
 ["gallium",69,60.11,71,39.89],["silver",107,51.84,109,48.16],["rubidium",85,72.2,87,27.8],["bromine",79,50.69,81,49.31]];
function f2(x){return (Math.round(x*100)/100).toFixed(2)}
function qAvg(){
  const e=pick(AVG),ans=f2((e[1]*e[2]+e[3]*e[4])/100);
  const swapped=f2((e[1]*e[4]+e[3]*e[2])/100),simple=f2((e[1]+e[3])/2),most=f2(e[2]>e[4]?e[1]:e[3]);
  let c=[swapped,simple,most,f2(+ans+0.5),f2(+ans-0.5)];
  return mcq("Average atomic mass (calc)","<b>"+e[0][0].toUpperCase()+e[0].slice(1)+"-"+e[1]+"</b> is "+e[2]+"% and <b>"+e[0]+"-"+e[3]+"</b> is "+e[4]+"%. What is the average atomic mass (two decimal places)?",
   ans+" amu",uniq3(ans,c).map(function(x){return x+" amu"}),
   "("+e[1]+" &times; "+e[2]+") + ("+e[3]+" &times; "+e[4]+") = "+(Math.round((e[1]*e[2]+e[3]*e[4])*100)/100)+" &divide; 100 = <b>"+ans+" amu</b>. Check: it should be closer to the more common isotope.");
}
const ABUND=[["boron",10,11,10.81],["chlorine",35,37,35.45],["copper",63,65,63.55],["lithium",6,7,6.94],["gallium",69,71,69.72],["bromine",79,81,79.90],["silver",107,109,107.87],["rubidium",85,87,85.47],["antimony",121,123,121.76]];
function qAbund(){
  const e=pick(ABUND),mid=(e[1]+e[2])/2,more=e[3]<mid?e[1]:e[2];
  const ans=e[0]+"-"+more,other=e[0]+"-"+(more===e[1]?e[2]:e[1]);
  return mcq("Infer abundance","<b>"+e[0][0].toUpperCase()+e[0].slice(1)+"</b> has two isotopes, "+e[0]+"-"+e[1]+" and "+e[0]+"-"+e[2]+". Its average atomic mass is <b>"+e[3]+" amu</b>. Which isotope is more abundant?",
   ans,[other,"They are equally abundant","You can\u2019t tell without the percents"],
   e[3]+" is closer to <b>"+more+"</b> than to "+(more===e[1]?e[2]:e[1])+" (halfway is "+mid+"), so <b>"+ans+"</b> is more common.");
}
const SCI=[["John Dalton","First atomic theory: tiny solid spheres"],["J.J. Thomson","Discovered the electron (plum pudding model)"],
 ["Ernest Rutherford","Discovered the nucleus (gold foil experiment)"],["Niels Bohr","Electrons in shells (orbital model)"],

+'<tr><td>electron</td><td>e\u207b</td><td>almost nothing</td><td>\u22121</td><td>electron cloud</td><td>chemical properties</td></tr></table></div>'
+'<div class="card"><h3>The formulas</h3><table>'
+'<tr><td>Protons</td><td>= atomic number</td></tr>'
+'<tr><td>Neutrons</td><td>= mass number &minus; atomic number</td></tr>'
+'<tr><td>Electrons</td><td>= protons &minus; charge &nbsp;(neutral: = protons)</td></tr>'
+'<tr><td>Mass number</td><td>= protons + neutrons</td></tr>'
+'<tr><td>Average atomic mass</td><td>= (mass\u2081 \u00d7 %\u2081 + mass\u2082 \u00d7 %\u2082 + \u2026) \u00f7 100</td></tr></table>'
+'<p style="margin-top:10px">Nuclear notation: '+nuc(75,33,"As",3)+' = mass number on top, atomic number on the bottom, charge top-right. Hyphen notation: <b>arsenic-75</b>.</p></div>'
+'<div class="card"><h3>Key #8, filled in</h3><table><tr><th>Isotope</th><th>Symbol</th><th>Z</th><th>A</th><th>n</th><th>p</th><th>e</th></tr>'
+'<tr><td>nitrogen-15 (3\u2212 ion)</td><td>'+nuc(15,7,"N",-3)+'</td><td>7</td><td>15</td><td>8</td><td>7</td><td>10</td></tr>'
+'<tr><td>neon-21</td><td>'+nuc(21,10,"Ne")+'</td><td>10</td><td>21</td><td>11</td><td>10</td><td>10</td></tr>'
+'<tr><td>beryllium-9</td><td>'+nuc(9,4,"Be")+'</td><td>4</td><td>9</td><td>5</td><td>4</td><td>4</td></tr>'
+'<tr><td>manganese-55 ion</td><td>'+nuc(55,25,"Mn",2)+'</td><td>25</td><td>55</td><td>30</td><td>25</td><td>23</td></tr>'
+'<tr><td>arsenic-75 ion</td><td>'+nuc(75,33,"As",3)+'</td><td>33</td><td>75</td><td>42</td><td>33</td><td>30</td></tr></table>'
+'<p class="tiny">The key labels the first row just \u201cnitrogen-15,\u201d but 7 protons with 10 electrons is a 3\u2212 ion. The table says \u201cDo NOT assume all isotopes are neutral.\u201d</p></div>'
+'<div class="card"><h3>Alpha, beta, gamma</h3><table><tr><th>Name</th><th>Charge</th><th>Mass</th><th>Symbol</th><th>Penetrating power</th></tr>'
+'<tr><td>alpha</td><td>2+</td><td>4 amu</td><td>\u03b1</td><td>low</td></tr>'
+'<tr><td>beta</td><td>1\u2212</td><td>almost nothing</td><td>\u03b2</td><td>moderate</td></tr>'
+'<tr><td>gamma</td><td>0</td><td>0</td><td>\u03b3</td><td>high</td></tr></table></div>'
+'<div class="card"><h3>Atomic models, in class order</h3><table><tr><th>#</th><th>Scientist</th><th>Contribution</th><th>Model</th></tr>'
+'<tr><td>1</td><td>John Dalton</td><td>First atomic theory</td><td>tiny solid sphere</td></tr>'
+'<tr><td>2</td><td>J.J. Thomson</td><td>Discovered electrons</td><td>plum pudding (positive material, electrons scattered in)</td></tr>'
+'<tr><td>3</td><td>Ernest Rutherford</td><td>Discovered the nucleus (gold foil)</td><td>positive nucleus, electrons around it</td></tr>'
+'<tr><td>4</td><td>Niels Bohr</td><td>Electron shells</td><td>electrons in rings around the nucleus</td></tr>'
+'<tr><td>5</td><td>James Chadwick</td><td>Discovered neutrons</td><td>shells, with neutrons in the nucleus</td></tr>'
+'<tr><td>6</td><td>Erwin Schr\u00f6dinger</td><td>Electrons exist in a cloud</td><td>electron cloud</td></tr></table>'
+'<p class="tiny">First particle found: electron (easy to produce free electrons). Last: neutron (in the nucleus, no charge).</p></div>'
+'<div class="card"><h3>Worked calculations from the key</h3>'
+'<p><b>#9 Rubidium:</b> (85 \u00d7 72.2) + (87 \u00d7 27.8) = 6137 + 2418.6 = 8555.6 \u00f7 100 = 85.556 &rarr; <b>85.56 amu</b> (two decimal places). The key circles 85.6 amu.</p>'
+'<p><b>#10 Graph:</b> (64\u00d749.17) + (66\u00d727.73) + (67\u00d74.04) + (68\u00d718.45) + (70\u00d70.61) = 6545.04 \u00f7 100 = <b>65.45 amu &rarr; zinc</b>.</p>'
+'<p><b>#11 Boron:</b> 10.81 is closer to 11, so <b>boron-11</b> is more abundant.</p></div>'
+'<div class="note">The BAT sheet says to expect earlier topics too. The <a href="chem.html">Unit 2 trainer</a> (Matter and Change) is still there for review.</div>';
